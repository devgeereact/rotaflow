version: 2

# Dependency alerts and updates are free on public repos. This matters more than
# usual here: the browser bundle ships Supabase auth and handles staff personal
# data, so a compromised transitive dependency runs in the same context as the
# session token.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Batch the noisy, low-risk updates into one PR each so review effort goes to
    # the things that actually change behaviour.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    # ---------------------------------------------------------------------
    # Toolchain majors are migrations, not upgrades, a human plans them.
    #
    # The first run of this config proved the point: it opened PRs for
    # TypeScript 5 -> 7, Tailwind 3 -> 4 and eslint-plugin-react-hooks 5 -> 7.
    # Tailwind 4 alone replaces the config format, and tailwind.config.ts now
    # carries the whole design system plus the brand tokens; merging that PR
    # does not upgrade the project, it breaks the build and leaves someone to
    # reconstruct the design system from a diff.
    #
    # Scope is deliberately narrow. Majors for *runtime* dependencies
    # (@supabase/supabase-js, @sentry/react, react-router-dom, date-fns…) still
    # open PRs: those are where a security fix is most likely to land
    # major-only, and this app holds staff personal data. Blanket-ignoring
    # every major would suppress exactly the updates worth seeing.
    # ---------------------------------------------------------------------
    ignore:
      # Framework, a React or Vite major is a planned migration.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # Language and build toolchain.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: postcss
        update-types: ['version-update:semver-major']
      - dependency-name: autoprefixer
        update-types: ['version-update:semver-major']
      # @vitest/coverage-v8's major is LOCKED to vitest's: v4 declares a hard
      # `peer vitest@4.1.10`, so bumping it alone makes `npm ci` fail with
      # ERESOLVE on a clean checkout. PR #78 proposed exactly that.
      #
      # It is worth naming why this nearly got through. Locally it looked fine:
      # typecheck, lint, the 254 tests and even `npm run test:coverage` all
      # passed, because `npm install` had already rewritten the lockfile to a
      # resolution `npm ci` will not accept. **`npm install` succeeding proves
      # nothing about `npm ci`.** CI caught it, as it did for
      # eslint-plugin-react-refresh below.
      #
      # Same shape as the tailwind-merge/tailwind coupling in audit01 §2: a
      # package whose major is meaningless except in lockstep with its host.
      # Lift this only in the same PR that moves vitest itself to 4.
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # Lint and format. An ESLint major means a config-format migration, and
      # its plugins move in lockstep with it.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-*'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react-refresh is 0.x, where the MINOR slot carries the
      # breaking change, so the major rule above cannot protect it and the
      # dev-dependencies group's `update-types: [minor, patch]` waves it
      # straight through. That is exactly what happened: PR #5 bumped it
      # 0.4.26 -> 0.5.3, which requires eslint ^9 || ^10 against this project's
      # eslint 8.57.1. It merged and `npm ci` on main started failing with
      # ERESOLVE. Main was red until #52. Pinned back to ^0.4.26; lift this
      # in the same PR that moves to ESLint 9.
      - dependency-name: eslint-plugin-react-refresh
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      # Vite plugins are pinned to the Vite major they support.
      - dependency-name: '@vitejs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: vite-plugin-pwa
        update-types: ['version-update:semver-major']
      # tailwind-merge's major track is coupled to Tailwind's: v2 = Tailwind 3,
      # v3 = Tailwind 4.0-4.3 ("if you use Tailwind v3, use tailwind-merge
      # v2.6.0". Its own README). This is a *runtime* dependency, so the rule
      # above would normally let its majors through; the exception is here
      # because the failure mode is silent.
      #
      # PR #45 (tailwind-merge 2.6.1 -> 3.6.0) was opened against Tailwind
      # 3.4.19 and would have passed typecheck, lint, format and build. V3
      # exports the same `twMerge` with the same signature. It would simply
      # resolve conflicting classes against a v4 class table at runtime, so
      # `cn()` starts returning the wrong winner in arbitrary places across the
      # app, with no error anywhere. Re-allow this only in the same PR that
      # moves the project to Tailwind 4.
      - dependency-name: tailwind-merge
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'

  # Actions are pinned by major tag (@v4), which still moves under us. Dependabot
  # is what surfaces a compromised or deprecated action.
  #
  # Grouped: the first run opened three separate PRs for three routine bumps.
  # Action majors are kept flowing rather than ignored. They are usually
  # mechanical, and a deprecated or compromised action is exactly what this
  # ecosystem entry exists to surface.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
