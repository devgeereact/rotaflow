name: Plan drift audit

# Weekly re-audit of docs/SAAS.md — the capability register — against the live
# repo — git log, migrations, and shipped code — so the plan can't go stale
# and silent the way its predecessor did (a two-week gap caught only by
# chance during an unrelated session). Requires the same rigor as a human
# doing the check by hand: read commits, read files, verify claims, don't
# just grep for keywords.
#
# On success: appends a dated entry to the plan doc, pushes it to the
# `plan-drift-audit/weekly` branch and opens (or updates) a pull request
# from that branch to main, so a person reviews and merges it. Never
# straight to main. Merging matters: `check-staleness` reads the doc on the
# default branch, so an audit nobody merges looks exactly like no audit.
# If the repository does not allow Actions to create pull requests, the
# job warns and falls back to a one-click compare link (see publish-branch).
# On failure: appends a FAILED marker instead of staying silent, because a
# missed run must be as visible as a completed one.
# Staleness: the `check-staleness` job runs independently of whether the
# audit job succeeds, so a stopped scheduler is caught even if this whole
# workflow stops firing (see job comment below).
#
# Two-job split is deliberate, not incidental: `audit` (the AI step) holds
# only `contents: read` — it is structurally incapable of pushing or opening
# a PR, even if a future prompt edit told it to. Only `publish-branch`
# (deterministic, no AI) holds `contents: write` and `pull-requests: write`.
# (`audit` used to carry `id-token: write` as well, a leftover from the
# first version of this workflow, which used an OIDC-authenticated action.
# Nothing has requested an OIDC token since the move to OpenRouter, so the
# grant was removed on 2026-10-11 and this comment is now true.) Least privilege for
# the AI-driven half, same principle as RLS being the enforcement boundary
# instead of client-side checks elsewhere in this project.
#
# ---------------------------------------------------------------------------
# FAILURE REPORTING — fixed 2026-08-20, after this workflow failed silently.
#
# The FAILED marker was previously written only by the AI step's own prompt.
# That could never work: if the AI step exited non-zero, every later step in
# the job was skipped (none carried `if: always()`), so `diff` never set the
# `changed` output, so the publish job — gated on `changed == 'true'` — was skipped
# too. The one run this workflow has ever had (2026-08-17) failed exactly
# that way: `audit` failed, the publish job skipped, nothing appended. A
# mechanism designed to make missed runs visible was structurally incapable
# of reporting its own failure.
#
# It is now deterministic and does not depend on the AI step succeeding, or
# even running:
#   * the API key is checked first, by shell, so a missing secret produces a
#     precise reason instead of an opaque action error
#   * the AI step is `continue-on-error`, so the job keeps going
#   * a plain shell step writes the FAILED marker whenever the AI step did
#     not succeed — no model involved in reporting that a model failed
#   * `diff` and `upload` run with `if: always()`
#   * `publish-branch` runs with `if: always()`, so a FAILED entry still
#     reaches a pushed branch a human can review
#   * the job is then marked red, so the run is visible in the Actions tab
#     as well as in the log
# ---------------------------------------------------------------------------

on:
  schedule:
    # Weekly, same day-of-week pattern as codeql.yml but offset so both
    # don't compete for runner minutes.
    - cron: '30 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plan-drift-audit
  cancel-in-progress: false

env:
  PLAN_DOC: docs/SAAS.md
  AUDIT_BRANCH: plan-drift-audit/weekly

jobs:
  audit:
    name: Run drift audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      audit_ok: ${{ steps.outcome.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history. actions/checkout defaults to a depth-1 shallow
          # clone, which starved this audit's single most important input:
          # `git log --oneline -50` returned exactly ONE commit in CI while
          # returning 50 locally, so the model was asked to judge what had
          # shipped with no history to judge from. Caught on the first real
          # run — the job still reported success, because a thin evidence
          # set looks identical to a thorough one from the outside.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Checked in shell rather than in an `if:` expression because the
      # `secrets` context is not reliably available to step conditionals.
      # Doing it here means "no key configured" produces a specific,
      # actionable FAILED reason rather than an opaque error mid-run.
      - name: Check the API key is configured
        id: keycheck
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is not set on this repository — the audit cannot run. Add it under Settings → Secrets and variables → Actions."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # OpenRouter, the same provider the app's own AI uses
      # (supabase/functions/ai-rota-assistant). There is deliberately no
      # Anthropic dependency in this project.
      #
      # The script splits the work so the model only does the judging:
      # evidence gathering and edit application are both deterministic, and
      # a correction that does not match the document exactly once is
      # skipped rather than guessed at. See its header for the reasoning.
      - name: Run drift audit (OpenRouter)
        id: audit
        if: steps.keycheck.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          APP_URL: https://rotaflow.space
        run: node scripts/plan-drift-audit.mjs

      # Deterministic failure reporting. No model runs here — this is the step
      # that guarantees a failed audit is still recorded, and it must not
      # depend on the thing it is reporting on.
      - name: Record the outcome
        id: outcome
        if: always()
        run: |
          if [ "${{ steps.keycheck.outputs.present }}" != 'true' ]; then
            OK=false
            REASON="OPENROUTER_API_KEY secret is not configured on this repository"
          elif [ "${{ steps.audit.outcome }}" != 'success' ]; then
            OK=false
            REASON="the OpenRouter drift-audit step did not succeed (outcome: ${{ steps.audit.outcome }}); see run ${{ github.run_id }}"
          else
            OK=true
            REASON=""
          fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          # Written as a plain `if`, not `[ ... ] && exit 0`: these steps run
          # under `bash -eo pipefail`, where a failing test at the head of an
          # AND-list can take the whole step down instead of falling through.
          if [ "$OK" = true ]; then
            echo "Audit completed normally."
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          echo "::warning::Drift audit did not complete: $REASON"

          # Create the log section if the audit never got far enough to.
          if ! grep -q '^## Drift Audit Log' "$PLAN_DOC"; then
            printf '\n## Drift Audit Log\n' >> "$PLAN_DOC"
          fi

          # Don't double-append if the AI step already recorded today's failure.
          if grep -q "^\*\*${TODAY}\*\*: FAILED:" "$PLAN_DOC"; then
            echo "A FAILED entry for $TODAY is already present; not adding a second."
            exit 0
          fi

          printf '\n**%s**: FAILED: %s\n' "$TODAY" "$REASON" >> "$PLAN_DOC"
          echo "Appended FAILED entry for $TODAY."

      - name: Check whether the file actually changed
        id: diff
        if: always()
        run: |
          if git diff --quiet -- "$PLAN_DOC"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload edited plan doc
        if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plan-doc
          path: docs/SAAS.md
          retention-days: 7

      # Last, so the artifact is uploaded and `publish-branch` still runs. This makes
      # the failure visible in the Actions tab, not only inside the doc.
      - name: Fail the job if the audit did not complete
        if: always() && steps.outcome.outputs.ok != 'true'
        run: |
          echo "::error::Plan-drift audit did not complete. A FAILED entry has been written to $PLAN_DOC and will appear on the audit branch and its pull request."
          exit 1

  publish-branch:
    name: Publish audit branch and pull request
    needs: audit
    # `always()` is load-bearing: without it a failed `audit` job skips this
    # one, which is exactly how the FAILED marker used to get thrown away.
    if: always() && needs.audit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # `contents: write` to push the branch, `pull-requests: write` to open or
    # update the pull request. No AI runs in this job.
    #
    # Opening the PR ALSO needs the repository setting "Allow GitHub Actions
    # to create and approve pull requests". It was off when this workflow
    # first ran, and that run failed with:
    #   ##[error]GitHub Actions is not permitted to create or approve pull requests.
    # So the PR step does not fail the job when that happens: the branch is
    # still pushed, the job warns, and the summary carries the compare link.
    # Turning the setting on is the owner's decision; it applies to every
    # workflow in the repository, not just this one.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download edited plan doc
        uses: actions/download-artifact@v8
        with:
          name: plan-doc
          path: docs/

      - name: Push the audit branch
        id: push
        run: |
          if git diff --quiet -- "$PLAN_DOC"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The downloaded plan doc matches the committed one — nothing to publish."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Force-update a single well-known branch: the newest audit replaces
          # the last one rather than accumulating branches, and an open pull
          # request from it picks the new commit up automatically.
          git checkout -q -B "$AUDIT_BRANCH"
          git add -- "$PLAN_DOC"
          git commit -q -m 'chore: weekly plan-drift audit'
          git push -q --force origin "$AUDIT_BRANCH"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed $AUDIT_BRANCH."

      - name: Open or update the pull request
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch || 'main' }}
          AUDIT_OK: ${{ needs.audit.outputs.audit_ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          DAY=$(date -u +%Y-%m-%d)
          if [ "$AUDIT_OK" = 'true' ]; then
            TITLE="chore: weekly plan-drift audit ($DAY)"
          else
            TITLE="chore: weekly plan-drift audit FAILED ($DAY)"
          fi
          BODY="Automated re-audit of $PLAN_DOC from $RUN_URL.

          Review each correction against the code before merging. Merging is what makes this entry visible to the staleness check, which reads the doc on $BASE.

          Evidence: generated by scripts/plan-drift-audit.mjs, which applies a correction only where it matches the document exactly once. NOT TESTED: whether each correction is true. That is the reviewer's job.

          Docs: this pull request is itself the documentation update."

          existing=$(gh pr list --head "$AUDIT_BRANCH" --base "$BASE" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            # The force-push above already put the new commit on this PR.
            if gh pr edit "$existing" --title "$TITLE" --body "$BODY" >/dev/null; then
              echo "url=$(gh pr view "$existing" --json url --jq .url)" >> "$GITHUB_OUTPUT"
              echo "Updated pull request #$existing."
            else
              echo "::warning::Pushed $AUDIT_BRANCH, which updates PR #$existing, but could not edit its title or body."
            fi
            exit 0
          fi

          if url=$(gh pr create --base "$BASE" --head "$AUDIT_BRANCH" --title "$TITLE" --body "$BODY"); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Opened $url"
          else
            echo "::warning::Could not open the pull request. Most likely the repository setting 'Allow GitHub Actions to create and approve pull requests' is off. The branch is pushed; open the PR from the link in the job summary."
          fi

      - name: Summarise
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## Weekly plan-drift audit"
            echo
            if [ "${{ needs.audit.outputs.audit_ok }}" = 'true' ]; then
              echo "Audit completed: **yes**"
            else
              echo "Audit completed: **NO** — the diff contains a dated \`FAILED:\` entry explaining why."
            fi
            echo
            if [ "${{ steps.push.outputs.pushed }}" = 'true' ]; then
              echo "Branch \`$AUDIT_BRANCH\` has been pushed."
              echo
              if [ -n "$PR_URL" ]; then
                echo "**[→ Review the pull request]($PR_URL)**"
              else
                echo "The pull request could not be opened automatically (see the warning in the log)."
                echo
                echo "**[→ Open the pull request](https://github.com/${{ github.repository }}/compare/${{ github.event.repository.default_branch || 'main' }}...$AUDIT_BRANCH?expand=1)**"
              fi
              echo
              echo "> Merging is what makes the log entry visible to the staleness check, which reads the doc on the default branch. Leaving audits unmerged will eventually trip that check."
              echo
              echo '### Changes'
              echo '```'
              git --no-pager diff --stat "origin/${{ github.event.repository.default_branch || 'main' }}...$AUDIT_BRANCH" -- "$PLAN_DOC" 2>/dev/null || true
              echo '```'
            else
              echo "No branch was pushed — the audit produced no change to publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  check-staleness:
    name: Check for a stopped scheduler
    runs-on: ubuntu-latest
    # Runs on every scheduled trigger regardless of whether `audit`/`publish-branch`
    # ran or succeeded, so it independently verifies the log itself is fresh
    # — the one thing that would NOT self-report if the scheduler stopped
    # firing entirely (deleted workflow, expired secret, disabled Actions).
    # Also runs on workflow_dispatch so the guard can be tested on demand
    # instead of only being exercised once a week.
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Verify last audit entry is under 10 days old
        run: |
          # Read from the log header to EOF. The previous version used
          # `grep -A200`, which silently stops looking 200 lines in — once the
          # log outgrew that window it would have read an OLD entry and either
          # fired spuriously or, worse, gone quiet about a genuinely stale log.
          LAST_ENTRY_DATE=$(sed -n '/^## Drift Audit Log/,$p' "$PLAN_DOC" 2>/dev/null \
            | grep -oE '^\*\*[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1 | tr -d '*' || true)

          if [ -z "$LAST_ENTRY_DATE" ]; then
            echo "::error::No drift-audit log entry found at all — the audit job may never have run successfully."
            exit 1
          fi

          LAST_EPOCH=$(date -d "$LAST_ENTRY_DATE" +%s 2>/dev/null \
            || date -j -f "%Y-%m-%d" "$LAST_ENTRY_DATE" +%s 2>/dev/null || true)
          if [ -z "$LAST_EPOCH" ]; then
            echo "::error::Could not parse the last drift-audit date ('$LAST_ENTRY_DATE'). The log format may have drifted from **YYYY-MM-DD**."
            exit 1
          fi

          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Last drift-audit entry: $LAST_ENTRY_DATE ($AGE_DAYS days ago)"

          # A FAILED entry keeps the log fresh, so this check alone would go
          # quiet while every audit failed. Flag a trailing FAILED explicitly.
          LAST_LINE=$(sed -n '/^## Drift Audit Log/,$p' "$PLAN_DOC" | grep -E '^\*\*[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1 || true)
          case "$LAST_LINE" in
            *FAILED:*)
              echo "::error::The most recent drift-audit entry ($LAST_ENTRY_DATE) is a FAILED marker — the audit is not actually running. $LAST_LINE"
              exit 1
              ;;
          esac

          if [ "$AGE_DAYS" -gt 10 ]; then
            echo "::error::Plan-drift audit log is $AGE_DAYS days stale (>10). The scheduler may have stopped firing silently — check this workflow's run history."
            exit 1
          fi
