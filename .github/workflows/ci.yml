name: CI

# RotaFlow had no CI at all until this file existed. Every commit went straight to
# main unverified, on a multi-tenant app where a bad build means a care rota nobody
# can read. These are the gates that already pass today, so any red here is a real
# regression introduced by the change under review, never pre-existing debt.
#
# The build deliberately runs with NO .env present. Vite inlines VITE_* at build time,
# so a workflow that supplied real Supabase/Sentry keys would (a) put production
# credentials in a public repo's logs and (b) hide the case that actually breaks, # a missing env var. src/lib/env.ts is written to degrade rather than throw, and this
# job is what keeps that true.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo. Without this block GITHUB_TOKEN
# gets the repository default, which is far broader than checkout needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Not the author's local zone. RotaFlow resolves shift wall-times through a
    # location's timezone, and the predecessor repo shipped a bug that was invisible
    # on a UK machine and only appeared under UTC. It built the instant from a date
    # STRING, which parses in the system zone. Pinning UTC here means CI never shares
    # the developer's zone and cannot hide that class of bug again.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN on disk for the rest of the job.
          persist-credentials: false
          # Full history, because `check:migrations` diffs against
          # `origin/main` to find migrations new in this branch. The default
          # shallow clone has no merge base, that diff fails, and the gate
          # fails CLOSED — so without this every pull request would break on a
          # check that had nothing to say.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first, but run it separately so a type
      # error is reported as a type error rather than buried in a failed bundle.
      - name: Typecheck
        run: npm run typecheck

      # --max-warnings 0, so warnings fail too. Currently 0 problems. Keep it there.
      - name: Lint
        run: npm run lint

      # Now a hard gate. The 37-file backlog that made this report-only was cleared
      # on 2026-07-29 with `npm run format`; the tree is Prettier-clean.
      #
      # Note for anyone hitting a surprise failure here: Prettier can move an
      # `eslint-disable-next-line` away from the line it suppresses, which turns a
      # working directive into an "unused disable directive" lint error. Anchor such
      # comments directly above the reported line. See src/hooks/useOptimizedImage.ts.
      - name: Format check
        run: npm run format:check

      # The first gate in this file that checks BEHAVIOUR rather than shape.
      #
      # Typecheck, lint, format and build all pass on an app that computes
      # overtime wrong, publishes a rota to the wrong tenant, or silently drops
      # a day's clock-ins. This job covers the paths where being wrong costs
      # someone money: clock events -> hours, the regular/overtime split, leave
      # entitlement, the schedule window, and the offline write outbox.
      #
      # NOTE the zone. The `TZ: UTC` on this job is deliberate and stays (see
      # the comment at the top), but UTC has no DST, so a UTC-only run cannot
      # see day-arithmetic bugs that only exist when the clocks change, # `resolvePeriod` was returning a zero-length window on 25 Oct 2026 in
      # Europe/London and every CI run here was green. vitest.config.ts pins
      # the suite to Europe/London for exactly that reason. Two zones, two
      # different bug classes; neither one covers the other.
      - name: Test
        run: npm test

      - name: Build (no .env. Must survive missing VITE_* vars)
        run: npm run build

      # A PWA that builds but emits no service worker is a silent regression: the app
      # keeps working online and quietly stops working offline, which is the whole
      # point of shipping it as a PWA to staff on hospital wifi.
      - name: Service worker and manifest were emitted
        run: |
          set -euo pipefail
          test -f dist/sw.js || { echo "::error::dist/sw.js missing. The PWA build produced no service worker"; ls -R dist | head -40; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing"; exit 1; }
          echo "✅ sw.js + manifest.webmanifest present"

      # Two bundle regressions have reached production and both were found by a
      # human reading `dist/` months later, never here: DEV preview pages
      # precached to every visitor (#75), and a lazy route becoming a static
      # import (#69). Neither changed a test, a type or a lint rule, so this is
      # the only step in `verify` that can catch them. Prints the numbers on
      # every run, pass or fail, so growth is visible while it is still small.
      - name: Bundle budget
        run: npm run check:bundle

      # Migrations auto-apply to production on merge and there are no backups
      # (GAP-001), so a destructive statement has already run against the only
      # copy of the data before anyone could object. `db-tests` cannot catch
      # that: it runs against an empty database where dropping a column costs
      # nothing. This asks the author to have written down why theirs is safe.
      - name: Migration safety
        run: npm run check:migrations

      # Counts written into prose, checked against the tree. The README told a
      # newcomer to run "0001 through 0066 — there are 66" when there were 91,
      # and quoted a test count that had been wrong twice. Most of those
      # numbers were deleted rather than corrected; the few worth stating are
      # verified here instead of trusted.
      - name: Documented counts
        run: npm run check:docs

      - name: Organisation export covers every tenant table
        run: npm run check:export

      # High/critical only: low/moderate in a 700-package tree is mostly
      # transitive dev-tooling noise that would make this gate cry wolf and
      # get ignored. `audit-level=high` still fails the build the day
      # something in the dependency tree is actually dangerous.
      - name: Dependency audit
        run: npm audit --audit-level=high

  # The only automated check that reads `supabase/functions/**` at all.
  #
  # Those files are Deno, and are excluded from `npm run typecheck` and
  # `npm run lint` — CLAUDE.md says plainly that "no automated check stands in
  # for reading those files". That was true of the whole tree until the
  # delivery audit of 2026-09-05 (RF-14) pointed out what it costs: the Edge
  # Functions are where billing, invitations and notifications live, they are
  # the only server compute this product has, and nothing verified they even
  # compiled. All eight entry points passed a manual check that day, so this
  # starts green rather than arriving with a backlog.
  #
  # It does not replace reading them. A type error is the cheapest possible
  # class of defect in a handler; RF-04 and RF-05 both typechecked perfectly.
  # The decision logic that can be pulled out of a handler belongs in a module
  # with no Deno globals, where vitest can run it in the `verify` job above —
  # `ai-rota-assistant/grounding.ts` and `stripe-webhook/reconcile.ts` are the
  # two worked examples.
  edge-types:
    name: edge-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `vX`. A minor Deno release changing what it accepts would
      # otherwise turn this gate red on a commit that touched nothing.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.5'

      # `--node-modules-dir=auto` because these functions import npm specifiers
      # (`npm:stripe@17`, `npm:@supabase/supabase-js@2`) and Deno will not
      # resolve their types without somewhere to put them. `deno.lock` is
      # committed, so this resolves to the same versions the check passed
      # against rather than to whatever the majors point at today.
      - name: Typecheck every Edge entry point
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

  # Separate job, not a step in `verify` above: needs Playwright's browser
  # binary (a real download, not just npm packages) and a live dev server,
  # neither of which the typecheck/lint/build gate should have to wait on.
  # A failure here does not mean the build is broken, `verify` staying green
  # says that; it means a critical path or a WCAG basic regressed.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Chromium only (see playwright.config.ts) — no --with-deps browsers
      # beyond the one project actually runs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # No .env here either, same reasoning as the build step above: these
      # tests exercise the public marketing/auth pages and DEV-only preview
      # routes, none of which need a real Supabase session.
      - name: E2E smoke + accessibility
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Third independent job: a real local Postgres via the Supabase CLI
  # (Docker, provided by ubuntu-latest, no external project and no secrets),
  # every migration applied to it, then pgTAP tests run against it. Neither
  # `verify` nor `e2e` can catch an RLS regression: `verify`'s vitest suite is
  # deliberately pure-logic over src/lib with no database at all
  # (vitest.config.ts), and `e2e` deliberately runs with no Supabase session.
  # This is what closes that gap — added after BUG-001
  # (docs/QA-AUDIT-REPORT.md): a broken `organisations_select` policy made
  # every new organisation fail to create, was fixed twice before
  # (migrations 0003, 0005) and regressed silently a third time (0031) with
  # nothing to catch it. supabase/tests/database/org_creation_bootstrap.test.sql
  # guards exactly that failure mode.
  # The half of GAP-010 that preview routes cannot reach: a real session.
  #
  # `e2e` renders 26 authenticated screens through `-preview` routes, which
  # mount the real components against fixtures with no session at all. That
  # proves a screen renders; it proves nothing about signing in, about RLS
  # scoping a query, or about a write landing. This signs up, creates an
  # organisation, and checks the tenant bootstrap actually completed.
  #
  # REQUIRED on `main` since 2026-08-31. It was deliberately not required when
  # added: it starts a Docker stack and drives a browser against it, which is
  # the flakiest shape of test here, and it should earn the place rather than
  # be declared into it.
  #
  # It earned it. Twelve consecutive green runs, and the one failure in that
  # stretch was a genuine defect it found — a transient first load showing a
  # brand-new customer an error card (#227) — not a flake. It is also the only
  # test that proves a customer can sign up at all, which is the exact failure
  # `docs/QA-AUDIT-REPORT.md` recorded and nothing else in CI could catch.
  #
  # If it does start flaking, take it out of the required list rather than
  # weakening its assertions.
  e2e-authenticated:
    name: e2e-authenticated
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Every migration against a fresh local Postgres, plus GoTrue and
      # PostgREST. Nothing outside this runner: no project ref, no login.
      - name: Start local Supabase stack
        run: supabase start

      # The keys are generated by the stack, so they are read from it rather
      # than hardcoded — a pinned key would break silently the day the CLI
      # changes its defaults, and read this way the test is pointed at
      # whatever `supabase start` actually produced.
      - name: Point the app at the local stack
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Sign up and create an organisation
        env:
          E2E_LIVE_SUPABASE: '1'
        run: npx playwright test e2e/authenticated-loop.spec.ts

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-authenticated
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Applies every migration in supabase/migrations to a fresh local
      # Postgres. No project ref, no login, nothing outside this runner.
      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # ── Is anything actually watching production? ────────────────────────────
  #
  # `backup.yml` (nightly encrypted dump) and `auth-config.yml` (Supabase Auth
  # settings against a baseline) are the two checks that read live state no pull
  # request can change. On 2026-08-31 BOTH were found to have never succeeded —
  # the repository held one secret, so there was no backup of production at all,
  # and nothing was asserting the auth settings. Each had failed loudly and
  # correctly on its first scheduled run, exactly as designed.
  #
  # It made no difference, and that is the thing this job fixes: **a scheduled
  # workflow fails where nobody is standing.** It blocks no merge, marks no pull
  # request red, and appears on no screen anybody opens. The gates above are seen
  # whether or not you go looking for them; a cron gate is only ever seen on
  # purpose, and "on purpose" did not happen for the twenty-four hours it took to
  # notice. See docs/SAAS.md GAP-036.
  #
  # ## Why this warns instead of failing
  #
  # Deliberate, and against this repository's usual instinct — `check:docs` fails
  # on an expiring `security.txt` precisely because a warning nobody must act on
  # is how a date arrives unnoticed.
  #
  # The difference is who can act. That expiry is fixed by editing a file in the
  # pull request that trips it. These two are fixed by minting credentials only
  # the repository owner holds, and blocking every merge until somebody does that
  # would stop all work on the project to protest a decision the person being
  # stopped may not be able to make. A red X on every pull request, naming the
  # secret and what is unprotected without it, puts the fact where it is read
  # without holding the codebase hostage to it.
  #
  # Uses the built-in GITHUB_TOKEN. Adds no secret, which would be a poor joke
  # in a job about missing ones.
  scheduled-checks:
    name: scheduled-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report whether the scheduled gates are armed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          status=0
          for wf in backup.yml auth-config.yml; do
            # `|| true` on the API call: a transient GitHub failure must not be
            # reported as "your backups are broken". No data is the one answer
            # this job does not turn into an alarm.
            runs=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=5"                      --jq '[.workflow_runs[] | {c: .conclusion, at: .created_at}]' 2>/dev/null || echo 'null')

            if [ "$runs" = "null" ]; then
              echo "::notice::Could not read $wf run history. Not treating that as a failure."
              continue
            fi

            total=$(echo "$runs" | jq 'length')
            ok=$(echo "$runs" | jq '[.[] | select(.c == "success")] | length')
            last=$(echo "$runs" | jq -r '.[0].c // "never run"')

            if [ "$total" = "0" ]; then
              echo "::warning file=.github/workflows/$wf::$wf has never run. It is scheduled, so it will not run on this pull request either — check the Actions tab before trusting whatever it protects."
              status=1
            elif [ "$ok" = "0" ]; then
              echo "::warning file=.github/workflows/$wf::$wf has NEVER succeeded (last run: $last). Its secrets are missing, so the thing it protects is unprotected. docs/SAAS.md GAP-036 lists which. This is a warning rather than a failure because only the repository owner can mint them."
              status=1
            elif [ "$last" != "success" ]; then
              echo "::warning file=.github/workflows/$wf::$wf last run: $last. It has succeeded before, so this is a regression rather than a missing secret."
              status=1
            else
              echo "  ok  $wf: last run succeeded"
            fi
          done

          if [ "$status" = "0" ]; then
            echo "Both scheduled gates are armed and green."
          else
            echo
            echo "The warnings above are visible on this pull request ON PURPOSE."
            echo "They describe production, not this branch, and nothing here can fix them."
          fi

