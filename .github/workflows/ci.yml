name: CI

# RotaFlow had no CI at all until this file existed. Every commit went straight to
# main unverified, on a multi-tenant app where a bad build means a care rota nobody
# can read. These are the gates that already pass today, so any red here is a real
# regression introduced by the change under review, never pre-existing debt.
#
# The build deliberately runs with NO .env present. Vite inlines VITE_* at build time,
# so a workflow that supplied real Supabase/Sentry keys would (a) put production
# credentials in a public repo's logs and (b) hide the case that actually breaks, # a missing env var. src/lib/env.ts is written to degrade rather than throw, and this
# job is what keeps that true.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo. Without this block GITHUB_TOKEN
# gets the repository default, which is far broader than checkout needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Not the author's local zone. RotaFlow resolves shift wall-times through a
    # location's timezone, and the predecessor repo shipped a bug that was invisible
    # on a UK machine and only appeared under UTC. It built the instant from a date
    # STRING, which parses in the system zone. Pinning UTC here means CI never shares
    # the developer's zone and cannot hide that class of bug again.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN on disk for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first, but run it separately so a type
      # error is reported as a type error rather than buried in a failed bundle.
      - name: Typecheck
        run: npm run typecheck

      # --max-warnings 0, so warnings fail too. Currently 0 problems. Keep it there.
      - name: Lint
        run: npm run lint

      # Now a hard gate. The 37-file backlog that made this report-only was cleared
      # on 2026-07-29 with `npm run format`; the tree is Prettier-clean.
      #
      # Note for anyone hitting a surprise failure here: Prettier can move an
      # `eslint-disable-next-line` away from the line it suppresses, which turns a
      # working directive into an "unused disable directive" lint error. Anchor such
      # comments directly above the reported line. See src/hooks/useOptimizedImage.ts.
      - name: Format check
        run: npm run format:check

      # The first gate in this file that checks BEHAVIOUR rather than shape.
      #
      # Typecheck, lint, format and build all pass on an app that computes
      # overtime wrong, publishes a rota to the wrong tenant, or silently drops
      # a day's clock-ins. This job covers the paths where being wrong costs
      # someone money: clock events -> hours, the regular/overtime split, leave
      # entitlement, the schedule window, and the offline write outbox.
      #
      # NOTE the zone. The `TZ: UTC` on this job is deliberate and stays (see
      # the comment at the top), but UTC has no DST, so a UTC-only run cannot
      # see day-arithmetic bugs that only exist when the clocks change, # `resolvePeriod` was returning a zero-length window on 25 Oct 2026 in
      # Europe/London and every CI run here was green. vitest.config.ts pins
      # the suite to Europe/London for exactly that reason. Two zones, two
      # different bug classes; neither one covers the other.
      - name: Test
        run: npm test

      - name: Build (no .env. Must survive missing VITE_* vars)
        run: npm run build

      # A PWA that builds but emits no service worker is a silent regression: the app
      # keeps working online and quietly stops working offline, which is the whole
      # point of shipping it as a PWA to staff on hospital wifi.
      - name: Service worker and manifest were emitted
        run: |
          set -euo pipefail
          test -f dist/sw.js || { echo "::error::dist/sw.js missing. The PWA build produced no service worker"; ls -R dist | head -40; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::dist/manifest.webmanifest missing"; exit 1; }
          echo "✅ sw.js + manifest.webmanifest present"

      # Two bundle regressions have reached production and both were found by a
      # human reading `dist/` months later, never here: DEV preview pages
      # precached to every visitor (#75), and a lazy route becoming a static
      # import (#69). Neither changed a test, a type or a lint rule, so this is
      # the only step in `verify` that can catch them. Prints the numbers on
      # every run, pass or fail, so growth is visible while it is still small.
      - name: Bundle budget
        run: npm run check:bundle

      # High/critical only: low/moderate in a 700-package tree is mostly
      # transitive dev-tooling noise that would make this gate cry wolf and
      # get ignored. `audit-level=high` still fails the build the day
      # something in the dependency tree is actually dangerous.
      - name: Dependency audit
        run: npm audit --audit-level=high

  # Separate job, not a step in `verify` above: needs Playwright's browser
  # binary (a real download, not just npm packages) and a live dev server,
  # neither of which the typecheck/lint/build gate should have to wait on.
  # A failure here does not mean the build is broken, `verify` staying green
  # says that; it means a critical path or a WCAG basic regressed.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Chromium only (see playwright.config.ts) — no --with-deps browsers
      # beyond the one project actually runs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # No .env here either, same reasoning as the build step above: these
      # tests exercise the public marketing/auth pages and DEV-only preview
      # routes, none of which need a real Supabase session.
      - name: E2E smoke + accessibility
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Third independent job: a real local Postgres via the Supabase CLI
  # (Docker, provided by ubuntu-latest, no external project and no secrets),
  # every migration applied to it, then pgTAP tests run against it. Neither
  # `verify` nor `e2e` can catch an RLS regression: `verify`'s vitest suite is
  # deliberately pure-logic over src/lib with no database at all
  # (vitest.config.ts), and `e2e` deliberately runs with no Supabase session.
  # This is what closes that gap — added after BUG-001
  # (docs/QA-AUDIT-REPORT.md): a broken `organisations_select` policy made
  # every new organisation fail to create, was fixed twice before
  # (migrations 0003, 0005) and regressed silently a third time (0031) with
  # nothing to catch it. supabase/tests/database/org_creation_bootstrap.test.sql
  # guards exactly that failure mode.
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Applies every migration in supabase/migrations to a fresh local
      # Postgres. No project ref, no login, nothing outside this runner.
      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
