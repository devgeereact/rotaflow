name: backup

# Nightly logical backup of production (docs/SAAS.md GAP-001).
#
# ## This is a mitigation, not the fix
#
# The fix for "no production backups" is Supabase's own: daily backups come
# with Pro, and point-in-time recovery is an add-on on top of that. The
# organisation is on the FREE plan, which has neither, and buying either is a
# recurring charge that is the owner's decision, not something to enable on
# their behalf. Until that happens this is what exists.
#
# What it gives: a nightly `pg_dump` of the whole database, encrypted, kept as
# a build artifact for 90 days. Enough to rebuild a table somebody dropped.
#
# What it does NOT give, and PITR does: recovery to a moment. If a bad
# migration lands at 14:00, the most recent copy is from last night, and
# everything since is gone. That is the gap this cannot close.
#
# ## Why the dump is encrypted
#
# This repository is PUBLIC. Artifacts on a public repository are downloadable
# by anyone who can read it, and this artifact is every staff record, every
# clock-in with its GPS trace, and the audit log. So it is encrypted with a
# passphrase held only in Actions secrets, and the workflow refuses to run
# without one — an unencrypted dump here would be a data breach dressed up as
# a backup.
#
# ## Setup, which is not done yet
#
# Two repository secrets, and the workflow fails loudly until both exist:
#
#   SUPABASE_DB_URL     the pooler connection string, from
#                       Project Settings → Database → Connection string (URI)
#   BACKUP_PASSPHRASE   any long random string, stored somewhere that is NOT
#                       this repository. Lose it and the backups are scrap.
#
# Restore:
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" rotaflow-*.sql.gpg \
#     | psql "$TARGET_DB_URL"
#
# Restore into a SCRATCH project first and look at it. A backup nobody has
# restored is a belief, not a backup.
#
# ## The rehearsal job below is what makes it more than a belief
#
# `verify-restore` takes the dump this run just produced, decrypts it, and
# restores it into a throwaway PostgreSQL in the runner — then asserts that
# what came back is a database rather than a file: the tables exist, the row
# counts are reported, and the critical ones are present.
#
# It does NOT replace a human restoring into a real Supabase project and
# looking at the app against it. A logical dump restored into stock Postgres
# proves the DATA survived; it cannot prove that auth, storage and RLS come
# back, because those are Supabase's and are not in this dump. ❓-005 stays
# open until somebody does the real thing. What this closes is the failure
# where the nightly job produces an encrypted file for months and the first
# person to open it discovers it never contained anything.

on:
  schedule:
    # 02:40 UTC, after the retention job at 02:15 so the dump reflects the
    # state retention leaves behind rather than catching it mid-delete.
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: dump
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets exist
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$DB_URL" ]     || missing="$missing SUPABASE_DB_URL"
          [ -n "$PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Backups are not configured. Missing secret(s):$missing."
            echo "::error::See the header of .github/workflows/backup.yml. Until these exist there is no backup of production at all."
            exit 1
          fi
          echo "Both secrets present."

      # The runner image ships PostgreSQL client tools, but not necessarily the
      # major version the server runs. A pg_dump older than the server refuses
      # outright, which is the right behaviour and a confusing failure, so the
      # matching client is installed explicitly.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Installing the package is not enough. `postgresql-client-common`
          # owns /usr/bin/pg_dump as a wrapper that dispatches to the DEFAULT
          # cluster version, and the runner image already carries 16 — so with
          # 17 installed alongside it, `pg_dump --version` still answered
          # "16.15" and the dump aborted with "server version mismatch"
          # against Postgres 17.6. Measured on run 33960168846, where the
          # install step succeeded and reported 16.15 in the same breath.
          #
          # Put the versioned binaries first for every later step, then assert
          # it, because the failure this prevents looks like a server problem
          # rather than a PATH one.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          major="$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)"
          [ "$major" = "17" ] || { echo "::error::pg_dump is $major, expected 17"; exit 1; }

      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M)"
          # Piped straight into gpg: the plaintext dump never touches the
          # runner's disk, where a later step or a cached path could pick it up.
          # `pipefail` above is what makes a pg_dump failure fail the job rather
          # than producing a valid encryption of nothing.
          pg_dump --no-owner --no-privileges --format=plain "$DB_URL" \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase "$PASSPHRASE" \
                  --output "rotaflow-${stamp}.sql.gz.gpg"

          size=$(stat -c%s "rotaflow-${stamp}.sql.gz.gpg")
          echo "Encrypted dump: rotaflow-${stamp}.sql.gz.gpg (${size} bytes)"

          # A dump of an empty or failed connection compresses to almost
          # nothing. Refuse it rather than retaining a file that looks like a
          # backup and restores to nothing.
          if [ "$size" -lt 2000 ]; then
            echo "::error::Dump is only ${size} bytes. That is not a real backup — check SUPABASE_DB_URL."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: rotaflow-db-backup
          path: '*.sql.gz.gpg'
          retention-days: 90
          if-no-files-found: error

  # ── Does the thing we just wrote actually restore? ─────────────────────
  #
  # Skipped automatically when `dump` fails, which includes the
  # secrets-missing case — one red job for one problem, rather than two.
  verify-restore:
    name: verify-restore
    needs: dump
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: rehearsal
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Fetch the dump this run produced
        uses: actions/download-artifact@v7
        with:
          name: rotaflow-db-backup

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Same wrapper problem as the dump job: without this, `psql` here is
          # the runner's 16 and the rehearsal restores a 17 dump with an older
          # client.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/psql --version

      - name: Decrypt and restore
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGPASSWORD: rehearsal
        run: |
          set -euo pipefail
          file=$(ls rotaflow-*.sql.gz.gpg | head -1)
          echo "Restoring $file"

          # Roles and extensions belong to Supabase and are not in this dump,
          # so a plain restore into stock PostgreSQL WILL log errors about
          # `supabase_admin`, `auth`, `storage` and similar. That is expected
          # rather than a failure, which is why ON_ERROR_STOP is off — the
          # test is what came back, asserted below, not whether every
          # statement applied. Silence here would be the misleading answer.
          gpg --decrypt --batch --quiet --passphrase "$PASSPHRASE" "$file" \
            | gunzip \
            | psql -h localhost -U postgres -d postgres > restore.log 2> restore.err || true

          echo "--- last 20 lines of stderr (roles and extensions are expected) ---"
          tail -20 restore.err || true

      - name: Assert a database came back, not a file
        env:
          PGPASSWORD: rehearsal
        run: |
          set -euo pipefail
          q() { psql -h localhost -U postgres -d postgres -tAc "$1"; }

          tables=$(q "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables restored: $tables"

          # The schema is 50+ tables. A handful means the restore fell over
          # early and the file is not what it claims to be.
          if [ "$tables" -lt 40 ]; then
            echo "::error::Only $tables tables restored. This backup would not bring the product back."
            exit 1
          fi

          # The four whose loss would be unrecoverable rather than annoying:
          # who the customers are, what they are working, what they were paid
          # for, and the record of who did what.
          for t in organisations shifts clock_events audit_logs; do
            exists=$(q "select to_regclass('public.$t') is not null")
            if [ "$exists" != "t" ]; then
              echo "::error::$t is missing from the restored database."
              exit 1
            fi
            echo "  $t: $(q "select count(*) from public.$t") rows"
          done

          # Reported rather than asserted. Production is pre-launch and
          # legitimately near-empty, so a row-count threshold here would fail
          # every night for a reason that is not a backup problem — and would
          # be quietly deleted by whoever got tired of it.
          echo "Restore rehearsal passed. This proves the DATA survives a"
          echo "round trip; auth, storage and RLS are Supabase's and are not"
          echo "in this dump. See docs/SAAS.md ❓-005."
