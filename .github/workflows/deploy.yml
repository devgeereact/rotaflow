# Deploy: the same `scripts/release.mjs --go` as on the Mac, over SSH (no FTP). The kit's workflow, with two changes.
#
# PUSH-TO-DEPLOY IS OFF until the cutover is done and signed off (docs/CUTOVER.md, "After the cutover"). Today this runs
# only when started by hand (workflow_dispatch), and the cutover itself is released from the owner's Mac, not from here.
# To turn it on afterwards: merge release/cutover into main, set "branch": "main" in release.json, add the push trigger
#   push:
#     branches: [main]
#     paths-ignore: ["docs/**", "**/*.md", ".agent/**"]
# under `on:`, create the repository variables named in the Release step's env (all public values) and the two secrets
# (~/Backups/scripts/setup-github-deploy.zsh), and enable Actions for this repository (owner decision; minutes are limited).
#
# Checks and build run first; any failure stops before upload. A failed smoke test restores the previous files
# automatically (snapshot in ~/backups/<project>/releases on the server). A commit message with [skip ci] does not deploy.
# Secrets: CPANEL_SSH_KEY, CPANEL_KNOWN_HOSTS.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (security audit, 1 Nov 2026): this job writes the cPanel SSH key,
# and a moved tag on a third-party action would run before it. Update a pin deliberately, never by tag.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, curl, openssl, mbstring
          coverage: none
      - name: Install
        # MariaDB for `pnpm run check` (check:php runs the PHP suites on a throwaway local database, scripts/test-db.sh).
        run: pnpm install --frozen-lockfile && sudo apt-get update -q && sudo apt-get install -y -q mariadb-server && sudo systemctl stop mariadb
      - name: SSH to cPanel
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY is not set: run setup-github-deploy.zsh"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host cpanel\n  HostName premium17.web-hosting.com\n  Port 21098\n  User devgeereact\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Release
        # The Mac build reads these from .env; here they come from repository variables (public values only).
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: node scripts/release.mjs --go
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
