<title>RotaFlow Platform Console</title>
<style>
  :root {
    --canvas:#F5F7FA; --surface:#FFFFFF; --subtle:#FAFBFC; --rail:#FAFBFC;
    --border:#E3E6EA; --divider:#F2F4F6;
    --ink:#16191F; --muted:#6B7280;
    --primary:#3B6FE0; --primary-fg:#FFFFFF; --primary-wash:#EEF3FD;
    --success:#1EA06B; --warning:#E0A030; --danger:#D94A3A; --info:#388FD4;
    --success-wash:#E7F5EE; --warning-wash:#FBF2E1; --danger-wash:#FAEAE7; --info-wash:#E8F2FA;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);
    --shadow:0 4px 12px rgba(0,0,0,.08);
    --shadow-lg:0 8px 24px rgba(0,0,0,.12);
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono","Roboto Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#0B1220; --surface:#111A2E; --subtle:#15203A; --rail:#0E1729;
      --border:#22304D; --divider:#1B2740;
      --ink:#F8FAFC; --muted:#94A3B8;
      --primary-wash:#182848;
      --success-wash:#102A21; --warning-wash:#2C2416; --danger-wash:#2E1A17; --info-wash:#12253A;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow:0 4px 12px rgba(0,0,0,.45);
      --shadow-lg:0 8px 24px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --canvas:#0B1220; --surface:#111A2E; --subtle:#15203A; --rail:#0E1729;
    --border:#22304D; --divider:#1B2740;
    --ink:#F8FAFC; --muted:#94A3B8;
    --primary-wash:#182848;
    --success-wash:#102A21; --warning-wash:#2C2416; --danger-wash:#2E1A17; --info-wash:#12253A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 4px 12px rgba(0,0,0,.45);
    --shadow-lg:0 8px 24px rgba(0,0,0,.55);
  }
  :root[data-theme="light"] {
    --canvas:#F5F7FA; --surface:#FFFFFF; --subtle:#FAFBFC; --rail:#FAFBFC;
    --border:#E3E6EA; --divider:#F2F4F6;
    --ink:#16191F; --muted:#6B7280;
    --primary-wash:#EEF3FD;
    --success-wash:#E7F5EE; --warning-wash:#FBF2E1; --danger-wash:#FAEAE7; --info-wash:#E8F2FA;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);
    --shadow:0 4px 12px rgba(0,0,0,.08);
    --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font:400 16px/1.5 var(--ui);
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--primary); }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* ---------- console frame ---------- */
  .console { display:grid; grid-template-columns:264px 1fr; min-height:100vh; }
  .rail {
    background:var(--rail); border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh; overflow-y:auto; padding:16px 12px 12px;
  }
  .brandbar { display:flex; align-items:center; gap:10px; padding:4px 8px 12px; }
  .mark {
    width:30px; height:30px; border-radius:8px; background:var(--primary);
    display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex:none;
  }
  .brandbar .wm { font-weight:650; letter-spacing:-.2px; }
  .envline { display:flex; align-items:center; gap:6px; padding:0 8px 12px; flex-wrap:wrap; }
  .eyebrow {
    font-size:10px; font-weight:650; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted);
  }
  .envbadge {
    font:600 10px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    padding:5px 7px; border-radius:999px;
    background:var(--danger-wash); color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  }
  .rolepick { padding:0 8px 12px; display:grid; gap:5px; }
  .rolepick select {
    width:100%; padding:7px 9px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); font-size:13px;
  }
  .nav { display:flex; flex-direction:column; gap:1px; }
  .navsec { padding:14px 8px 5px; }
  .nav a {
    display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:9px;
    color:var(--ink); text-decoration:none; font-size:13.5px; font-weight:500;
  }
  .nav a:hover { background:var(--primary-wash); }
  .nav a[aria-current="page"] { background:var(--primary); color:var(--primary-fg); }
  .nav a[aria-current="page"] .ico { opacity:1; }
  .nav a .ico { width:16px; height:16px; flex:none; opacity:.72; }
  .nav a .count {
    margin-left:auto; font:600 11px/1 var(--mono); padding:3px 6px; border-radius:999px;
    background:var(--danger); color:#fff;
  }
  .nav a[aria-current="page"] .count { background:rgba(255,255,255,.24); }
  .railfoot { margin-top:auto; padding-top:12px; border-top:1px solid var(--divider); }
  .whoami { display:flex; align-items:center; gap:9px; padding:9px 8px; border-radius:10px; }
  .whoami:hover { background:var(--primary-wash); }
  .av {
    width:30px; height:30px; border-radius:999px; flex:none; display:grid; place-items:center;
    background:var(--primary-wash); color:var(--primary); font-weight:650; font-size:12px;
    border:1px solid color-mix(in srgb, var(--primary) 22%, transparent);
  }
  .whoami .nm { font-size:13px; font-weight:600; line-height:1.25; }
  .whoami .rl { font-size:11px; color:var(--muted); line-height:1.3; }

  /* ---------- main ---------- */
  main { min-width:0; display:flex; flex-direction:column; }
  .topbar {
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px; padding:10px 24px;
  }
  .crumbs { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; min-width:0; }
  .crumbs b { color:var(--ink); font-weight:600; }
  .topbar .spacer { margin-left:auto; }
  .wrap { padding:24px; max-width:1440px; width:100%; }

  /* ---------- support access banner ---------- */
  .sabanner {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--warning-wash); color:var(--ink);
    border-bottom:1px solid color-mix(in srgb, var(--warning) 40%, transparent);
    padding:10px 24px; font-size:13.5px;
  }
  .sabanner .dot {
    width:8px; height:8px; border-radius:999px; background:var(--warning); flex:none;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .sabanner strong { font-weight:650; }
  .sabanner .clock { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; }

  /* ---------- primitives ---------- */
  h1 { font-size:32px; line-height:40px; font-weight:650; margin:0; letter-spacing:-.5px; text-wrap:balance; }
  h2 { font-size:24px; line-height:32px; font-weight:650; margin:0; letter-spacing:-.3px; text-wrap:balance; }
  h3 { font-size:16px; line-height:24px; font-weight:650; margin:0; }
  .lede { color:var(--muted); font-size:14px; margin:6px 0 0; max-width:64ch; }
  .pagehead { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .pagehead .acts { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

  .btn {
    display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:11px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:13.5px; font-weight:550; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .btn:hover { background:var(--subtle); }
  .btn.p { background:var(--primary); border-color:var(--primary); color:var(--primary-fg); }
  .btn.p:hover { filter:brightness(1.07); }
  .btn.d { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 34%, transparent); }
  .btn.d:hover { background:var(--danger-wash); }
  .btn.sm { padding:5px 9px; font-size:12.5px; border-radius:9px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow-sm);
  }
  .card > header {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:14px 16px; border-bottom:1px solid var(--divider);
  }
  .card > header .spacer { margin-left:auto; }
  .card .body { padding:16px; }
  .grid { display:grid; gap:16px; }

  /* metric tiles */
  .tiles { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .tile {
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 15px;
    display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit;
    box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  }
  a.tile:hover { border-color:color-mix(in srgb, var(--primary) 45%, var(--border)); box-shadow:var(--shadow); }
  .tile .lbl { font-size:12px; color:var(--muted); font-weight:550; }
  .tile .val { font:650 28px/1.1 var(--ui); font-variant-numeric:tabular-nums; letter-spacing:-.6px; }
  .tile .sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .tile .spark { margin-top:2px; }
  .up { color:var(--success); font-weight:600; }
  .down { color:var(--danger); font-weight:600; }

  /* pills */
  .pill {
    display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px;
    font-size:11.5px; font-weight:600; white-space:nowrap; border:1px solid transparent;
  }
  .pill::before { content:""; width:6px; height:6px; border-radius:999px; background:currentColor; flex:none; }
  .pill.ok { background:var(--success-wash); color:var(--success); }
  .pill.warn { background:var(--warning-wash); color:var(--warning); }
  .pill.bad { background:var(--danger-wash); color:var(--danger); }
  .pill.info { background:var(--info-wash); color:var(--info); }
  .pill.neutral { background:var(--subtle); color:var(--muted); border-color:var(--border); }
  .pill.plain::before { display:none; }

  /* tables */
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th {
    text-align:left; font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
    background:var(--subtle); position:sticky; top:0;
  }
  td { padding:10px 12px; border-bottom:1px solid var(--divider); vertical-align:middle; }
  tbody tr:hover td { background:var(--subtle); }
  tbody tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .mono { font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .dim { color:var(--muted); }
  .strong { font-weight:600; }
  .two-line .t { font-weight:600; line-height:1.3; display:block; }
  .two-line .s { font-size:12px; color:var(--muted); line-height:1.3; display:block; }
  .rowav { display:flex; align-items:center; gap:9px; min-width:0; }

  /* filter bar */
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; border-bottom:1px solid var(--divider); }
  .filters input[type="search"], .filters select {
    padding:7px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13px;
  }
  .filters input[type="search"] { min-width:230px; }

  /* tabs */
  .tabs { display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tabs button {
    padding:9px 13px; border:0; background:none; cursor:pointer; font-size:13.5px; font-weight:550;
    color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tabs button[aria-selected="true"] { color:var(--primary); border-bottom-color:var(--primary); }
  .tabs button:hover { color:var(--ink); }

  /* definition rows */
  .dl { display:grid; grid-template-columns:minmax(120px,auto) 1fr; gap:1px 16px; font-size:13.5px; }
  .dl dt { color:var(--muted); padding:7px 0; }
  .dl dd { margin:0; padding:7px 0; font-weight:550; }

  /* feed */
  .feed { display:flex; flex-direction:column; }
  .feed li { display:flex; gap:11px; padding:11px 16px; border-bottom:1px solid var(--divider); list-style:none; }
  .feed li:last-child { border-bottom:0; }
  .feed .fi { width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex:none; }
  .feed .ft { font-size:13.5px; line-height:1.4; display:block; }
  .feed .fm { font-size:12px; color:var(--muted); margin-top:2px; display:block; }
  ul.feed { margin:0; padding:0; }

  /* service list */
  .svc { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--divider); }
  .svc:last-child { border-bottom:0; }
  .svc .nm { font-size:13.5px; font-weight:550; }
  .svc .bars { display:flex; gap:2px; margin-left:auto; }
  .svc .bars i { width:4px; height:18px; border-radius:2px; background:var(--success); display:block; }
  .svc .bars i.w { background:var(--warning); }
  .svc .bars i.b { background:var(--danger); }

  /* bar chart rows */
  .bars-row { display:grid; grid-template-columns:96px 1fr 62px; align-items:center; gap:10px; padding:7px 0; font-size:13px; }
  .bars-row .track { height:8px; border-radius:999px; background:var(--subtle); overflow:hidden; border:1px solid var(--border); }
  .bars-row .fill { height:100%; border-radius:999px; background:var(--primary); }
  .bars-row .amt { text-align:right; font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; }

  /* toggle */
  .sw { width:38px; height:22px; border-radius:999px; border:1px solid var(--border); background:var(--subtle); position:relative; cursor:pointer; flex:none; padding:0; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background:var(--surface); box-shadow:var(--shadow-sm); transition:left .16s ease; }
  .sw[aria-checked="true"] { background:var(--primary); border-color:var(--primary); }
  .sw[aria-checked="true"]::after { left:18px; }

  /* modal */
  dialog {
    border:1px solid var(--border); border-radius:18px; background:var(--surface); color:var(--ink);
    padding:0; box-shadow:var(--shadow-lg); max-width:520px; width:calc(100% - 32px);
  }
  dialog::backdrop { background:rgba(10,16,30,.42); backdrop-filter:blur(2px); }
  dialog header { padding:16px 18px 12px; border-bottom:1px solid var(--divider); }
  dialog .body { padding:16px 18px; display:grid; gap:13px; }
  dialog footer { padding:13px 18px; border-top:1px solid var(--divider); display:flex; gap:8px; justify-content:flex-end; }
  .field { display:grid; gap:5px; }
  .field label { font-size:12.5px; font-weight:600; }
  .field input, .field select, .field textarea {
    padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; width:100%;
  }
  .field textarea { min-height:70px; resize:vertical; font-family:inherit; }
  .field .hint { font-size:11.5px; color:var(--muted); }
  .field .err { font-size:11.5px; color:var(--danger); font-weight:600; }
  .check { display:flex; gap:9px; align-items:flex-start; font-size:13px; }
  .check input { margin-top:2px; }

  /* callouts */
  .callout { display:flex; gap:11px; padding:13px 15px; border-radius:14px; font-size:13.5px; line-height:1.5; border:1px solid; }
  .callout.warn { background:var(--warning-wash); border-color:color-mix(in srgb, var(--warning) 34%, transparent); }
  .callout.info { background:var(--info-wash); border-color:color-mix(in srgb, var(--info) 30%, transparent); }
  .callout.bad { background:var(--danger-wash); border-color:color-mix(in srgb, var(--danger) 34%, transparent); }

  .empty { padding:44px 16px; text-align:center; color:var(--muted); font-size:13.5px; }
  .locked { max-width:520px; margin:56px auto; text-align:center; }
  .locked .shield { width:56px; height:56px; margin:0 auto 16px; color:var(--danger); }

  /* toast */
  .toasts { position:fixed; right:18px; bottom:18px; z-index:60; display:grid; gap:8px; }
  .toast {
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--success);
    border-radius:12px; padding:11px 14px; box-shadow:var(--shadow-lg); font-size:13.5px; max-width:340px;
  }
  .toast.bad { border-left-color:var(--danger); }

  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .railtoggle { display:none; }

  @media (max-width:1000px) {
    .console { grid-template-columns:1fr; }
    .rail { position:fixed; inset:0 auto 0 0; width:264px; z-index:50; transform:translateX(-100%); transition:transform .18s ease; }
    .rail.open { transform:none; box-shadow:var(--shadow-lg); }
    .railtoggle { display:inline-flex; }
    .wrap { padding:16px; }
    .topbar { padding:10px 16px; }
    h1 { font-size:26px; line-height:34px; }
  }
</style>

<div class="console">
  <aside class="rail" id="rail">
    <div class="brandbar">
      <div class="mark">R</div>
      <div>
        <div class="wm">RotaFlow</div>
        <div class="eyebrow">Platform Console</div>
      </div>
    </div>
    <div class="envline">
      <span class="envbadge" id="envBadge">Production</span>
      <span class="eyebrow" style="color:var(--muted)">eu-west-2</span>
    </div>
    <div class="rolepick">
      <label class="eyebrow" for="roleSel">Signed in as</label>
      <select id="roleSel" aria-label="Platform role"></select>
    </div>
    <nav class="nav" id="nav" aria-label="Platform"></nav>
    <div class="railfoot">
      <nav class="nav" id="nav2" aria-label="Secondary"></nav>
      <div class="whoami" id="whoami">
        <div class="av" id="whoAv">SA</div>
        <div>
          <div class="nm">Sarah Okonjo</div>
          <div class="rl" id="whoRole">Platform Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div id="banner"></div>
    <div class="topbar">
      <button class="btn sm railtoggle" id="railBtn" aria-label="Toggle navigation">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <button class="btn sm" id="refreshBtn">Refresh</button>
      <button class="btn sm" id="saBtn">Request support access</button>
    </div>
    <div class="wrap" id="screen"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<dialog id="modal"></dialog>

<script>
/* ============================ platform roles ============================ */
const ROLES = {
  owner:   { name:'Platform Owner',         short:'Owner' },
  admin:   { name:'Platform Administrator', short:'Admin' },
  support: { name:'Platform Support',       short:'Support' },
  finance: { name:'Platform Finance',       short:'Finance' },
};
const ALL = ['owner','admin','support','finance'];
const CONFIG = ['owner','admin'];
const BILLING = ['owner','admin','finance'];
const OPS = ['owner','admin','support'];

/* nav = the route table; `allow` is the same list the route guard uses, so a
   role that cannot see a link also cannot reach it by typing the hash. */
const NAV = [
  { id:'overview',      label:'Overview',          icon:'grid',    allow:ALL },
  { id:'organisations', label:'Organisations',     icon:'building',allow:ALL },
  { id:'users',         label:'Users',             icon:'users',   allow:OPS },
  { id:'subscriptions', label:'Subscriptions',     icon:'card',    allow:BILLING },
  { id:'billing',       label:'Billing',           icon:'receipt', allow:BILLING },
  { id:'support',       label:'Support Centre',    icon:'life',    allow:OPS, badge:'openCases' },
  { id:'support-access',label:'Support Access',    icon:'key',     allow:OPS },
  { id:'platform-health',label:'Platform Health',  icon:'pulse',   allow:ALL },
  { id:'incidents',     label:'Incidents',         icon:'alert',   allow:OPS, badge:'openIncidents' },
  { id:'integrations',  label:'Integrations',      icon:'plug',    allow:OPS },
  { id:'notifications', label:'Notifications',     icon:'bell',    allow:CONFIG },
  { id:'audit',         label:'Audit Logs',        icon:'scroll',  allow:ALL },
  { id:'feature-flags', label:'Feature Flags',     icon:'flag',    allow:CONFIG },
  { id:'gdpr',          label:'GDPR & Data',       icon:'shield',  allow:CONFIG },
  { id:'settings',      label:'Platform Settings', icon:'cog',     allow:CONFIG },
];
const NAV2 = [
  { id:'docs',    label:'Documentation',  icon:'book' },
  { id:'status',  label:'System Status',  icon:'pulse' },
  { id:'psupport',label:'Platform Support', icon:'life' },
  { id:'exit',    label:'Return to Organisation', icon:'exit' },
];

/* ============================ icons (lucide-shaped) ============================ */
const P = {

function sparkline(vals, tint='var(--primary)', w=110, h=26) {
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v,i) => [i*(w/(vals.length-1)), h - 2 - ((v-min)/span)*(h-5)]);
  const line = pts.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  const area = `${line} L${w} ${h} L0 ${h} Z`;
  const id = 'g' + Math.random().toString(36).slice(2,8);
  const [ex,ey] = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${tint}" stop-opacity=".22"/><stop offset="1" stop-color="${tint}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${tint}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.4" fill="${tint}"/>
  </svg>`;
}

function areaChart(series, labels, h=180) {
  const w = 720, pad = { l:8, r:8, t:12, b:22 };
  const all = series.flatMap(s => s.vals);
  const max = Math.max(...all) * 1.12, min = 0;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = i => pad.l + i * (iw / (labels.length - 1));
  const Y = v => pad.t + ih - ((v - min) / (max - min)) * ih;
  const grid = [0,.25,.5,.75,1].map(f =>
    `<line x1="${pad.l}" x2="${w-pad.r}" y1="${(pad.t+ih*f).toFixed(1)}" y2="${(pad.t+ih*f).toFixed(1)}"
      stroke="var(--divider)" stroke-width="1"/>`).join('');
  const paths = series.map((s,si) => {
    const id = 'c'+si+Math.random().toString(36).slice(2,6);
    const line = s.vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const fill = s.fill === false ? '' :
      `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${s.color}" stop-opacity=".2"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${line} L${X(s.vals.length-1)} ${pad.t+ih} L${pad.l} ${pad.t+ih} Z" fill="url(#${id})"/>`;
    return fill + `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(s.vals.length-1).toFixed(1)}" cy="${Y(s.vals[s.vals.length-1]).toFixed(1)}" r="3.2" fill="${s.color}"/>`;
  }).join('');
  const xl = labels.map((l,i) => (i % Math.ceil(labels.length/7) === 0 || i === labels.length-1)
    ? `<text x="${X(i).toFixed(1)}" y="${h-5}" font-size="10" fill="var(--muted)"
        text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}" font-family="var(--mono)">${esc(l)}</text>` : '').join('');
  const legend = series.map(s =>
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)">
      <i style="width:9px;height:9px;border-radius:3px;background:${s.color};display:block"></i>${esc(s.name)}</span>`).join('');
  return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px">${legend}</div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Trend chart" preserveAspectRatio="none">
      ${grid}${paths}${xl}</svg>`;
}

function barRows(rows, tint) {
  const max = Math.max(...rows.map(r => r.v));
  return rows.map(r => `<div class="bars-row">
    <span class="dim">${esc(r.k)}</span>
    <span class="track"><span class="fill" style="width:${(r.v/max*100).toFixed(1)}%;background:${r.color||tint||'var(--primary)'}"></span></span>
    <span class="amt">${esc(r.d ?? n(r.v))}</span></div>`).join('');
}

function table(cols, rows, opts = {}) {
  const head = cols.map(c => `<th${c.num?' class="num"':''}>${esc(c.h)}</th>`).join('');
  const body = rows.length ? rows.map(r =>
    `<tr>${r.map((cell,i) => `<td${cols[i].num?' class="num"':''}>${cell}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}"><div class="empty">${esc(opts.empty || 'Nothing matches these filters.')}</div></td></tr>`;
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function tiles(list) {
  return `<div class="tiles">${list.map(t => {
    const tag = t.to ? 'a' : 'div', href = t.to ? ` href="#/${t.to}"` : '';
    return `<${tag} class="tile"${href}>
      <span class="lbl">${esc(t.lbl)}</span>
      <span class="val">${esc(t.val)}</span>
      <span class="sub">${t.sub || ''}</span>
      ${t.spark ? sparkline(t.spark, t.tint) : ''}
    </${tag}>`;
  }).join('')}</div>`;
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3400);
  setTimeout(() => el.remove(), 3800);
}

<script>
/* ============================ shell: nav, router, guards ============================ */
function renderRail() {
  const cur = location.hash.slice(2).split('/')[0] || 'overview';
  $('#nav').innerHTML =
    `<div class="navsec eyebrow">Platform</div>` +
    NAV.filter(item => item.allow.includes(state.role)).map(item => {
      const count = item.badge ? BADGES[item.badge]() : 0;
      return `<a href="#/${item.id}"${cur === item.id ? ' aria-current="page"' : ''}>
        ${ico(item.icon)}<span>${esc(item.label)}</span>
        ${count ? `<span class="count">${count}</span>` : ''}</a>`;
    }).join('');
  $('#nav2').innerHTML = NAV2.map(item =>
    `<a href="#/${item.id}">${ico(item.icon)}<span>${esc(item.label)}</span></a>`).join('');
  $('#whoRole').textContent = ROLES[state.role].name;
  $('#whoAv').textContent = initials(ME.name);
}

function crumbs(parts) {
  $('#crumbs').innerHTML = ['Platform Console', ...parts]
    .map((p, i, a) => i === a.length - 1 ? `<b>${esc(p)}</b>` : esc(p))
    .join(' <span aria-hidden="true">/</span> ');
}

function guard(id) {
  const item = NAV.find(x => x.id === id);
  return !item || item.allow.includes(state.role);
}

function lockedScreen(id) {
  const item = NAV.find(x => x.id === id);
  const allowed = item.allow.map(r => ROLES[r].name).join(', ');
  return `<div class="locked">
    <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P.shield}"/></svg>
    <h1>Platform access restricted</h1>
    <p class="lede" style="margin:10px auto 0">
      <b>${esc(item.label)}</b> is not available to a ${esc(ROLES[state.role].name)}.
      This route is refused by the server and by row-level security, not only hidden from the sidebar.</p>
    <div class="card" style="margin:22px 0;text-align:left">
      <div class="body">
        <dl class="dl">
          <dt>Signed in as</dt><dd>${esc(ME.name)} · ${esc(ME.email)}</dd>
          <dt>Platform role</dt><dd>${esc(ROLES[state.role].name)}</dd>
          <dt>Required</dt><dd>${esc(allowed)}</dd>
          <dt>Attempt logged</dt><dd class="mono">platform.access_denied · ${esc(id)}</dd>
        </dl>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <a class="btn p" href="#/overview">Back to Overview</a>
      <button class="btn" onclick="toast('Signed out of the platform console.')">Sign out</button>
    </div>
  </div>`;
}

function renderBanner() {
  const b = $('#banner');
  if (!state.session) { b.innerHTML = ''; return; }
  const org = orgById(state.session.org);
  b.innerHTML = `<div class="sabanner" role="status">
    <span class="dot"></span>
    <span><strong>Support access active.</strong> You are temporarily viewing
      <a href="#/organisations/${org.id}">${esc(org.name)}</a> · ${esc(state.session.scope)}</span>
    <span>Expires in <span class="clock" id="saClock">-</span></span>
    <button class="btn sm d" style="margin-left:auto" onclick="endSession('Exited')">Exit support session</button>
  </div>`;
  tickClock();
}
let clockTimer = null;
function tickClock() {
  clearInterval(clockTimer);
  const paint = () => {
    if (!state.session) return;
    const left = Math.max(0, state.session.until - Date.now());
    if (left === 0) { endSession('Expired'); return; }
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    const el = $('#saClock');
    if (el) el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  };
  paint();
  clockTimer = setInterval(paint, 1000);
}
function endSession(how) {
  if (!state.session) return;
  const org = orgById(state.session.org);
  const rec = state.sessions.find(s => s.live);
  if (rec) { rec.live = false; rec.status = how === 'Expired' ? 'expired' : 'revoked'; }
  logAudit('support_access.ended', { org:org.id, ent:'support session', from:'active', to:how.toLowerCase() });
  state.session = null;
  clearInterval(clockTimer);
  renderBanner(); route();
  toast(`${how} support session for ${org.name}.`);
}

const SCREENS = {};
function route() {
  const [id = 'overview', a, b] = location.hash.slice(2).split('/');
  renderRail();
  /* `hasOwn`, not a bare lookup: the id comes from the URL hash, and
     SCREENS['constructor'] resolves up the prototype chain to a function this
     would then invoke. Own-property only, so an unknown hash lands on the
     "not built" screen rather than calling something. */
  const known = Object.hasOwn(SCREENS, id) ? SCREENS[id] : undefined;
  if (!known) {
    crumbs([id]);
    $('#screen').innerHTML = `<div class="locked">
      <h1>Not built yet</h1>
      <p class="lede" style="margin:10px auto 0">
        <span class="mono">#/${esc(id)}</span> is a secondary link in this prototype.</p>
      <p style="margin-top:18px"><a class="btn p" href="#/overview">Back to Overview</a></p></div>`;
    return;
  }
  if (!guard(id)) { crumbs([NAV.find(x => x.id === id).label]); $('#screen').innerHTML = lockedScreen(id); return; }
  $('#screen').innerHTML = known(a, b);
  window.scrollTo({ top:0, behavior:'instant' });
  $$('[data-tabs]').forEach(wireTabs);
  $$('[data-filter]').forEach(wireFilter);
}

function wireTabs(root) {
  const btns = [...root.querySelectorAll('.tabs button')];
  btns.forEach(btn => btn.onclick = () => {
    btns.forEach(x => x.setAttribute('aria-selected', String(x === btn)));
    root.querySelectorAll('[data-panel]').forEach(p =>
      p.hidden = p.dataset.panel !== btn.dataset.tab);
  });
}
function wireFilter(root) {
  const q = root.querySelector('input[type="search"]');
  const sels = [...root.querySelectorAll('select[data-key]')];
  const rows = [...root.querySelectorAll('tbody tr[data-row]')];
  const empty = root.querySelector('[data-empty]');
  const apply = () => {
    const term = (q?.value || '').trim().toLowerCase();
    let shown = 0;
    rows.forEach(tr => {
      const hitText = !term || tr.dataset.row.toLowerCase().includes(term);
      const hitSel = sels.every(s => !s.value || (tr.dataset[s.dataset.key] || '') === s.value);
      const vis = hitText && hitSel;
      tr.hidden = !vis; if (vis) shown++;
    });
    if (empty) empty.hidden = shown > 0;
    const c = root.querySelector('[data-count]');
    if (c) c.textContent = `${shown} of ${rows.length}`;
  };
  q?.addEventListener('input', apply);
  sels.forEach(s => s.addEventListener('change', apply));
  apply();
}

/* ============================ modal ============================ */
function modal({ title, sub, body, confirm, danger, reason, reauth, onOk }) {
  const dlg = $('#modal');
  dlg.innerHTML = `<form method="dialog">
    <header>
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="lede" style="margin-top:4px">${sub}</p>` : ''}
    </header>
    <div class="body">
      ${body || ''}
      ${reason ? `<div class="field">
        <label for="mReason">Reason (recorded in the audit log)</label>
        <textarea id="mReason" placeholder="Why is this necessary?"></textarea>
        <span class="err" id="mReasonErr" hidden>A reason is required before this action is recorded.</span>
      </div>` : ''}
      ${reauth ? `<div class="field">
        <label for="mPass">Confirm your password</label>
        <input id="mPass" type="password" placeholder="••••••••" autocomplete="current-password">
        <span class="hint">Critical platform actions re-authenticate before they are written.</span>
        <span class="err" id="mPassErr" hidden>Password required to continue.</span>
      </div>` : ''}
    </div>
    <footer>
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn ${danger ? 'd' : 'p'}" id="mOk" type="button">${esc(confirm || 'Confirm')}</button>
    </footer>
  </form>`;
  dlg.showModal();
  dlg.querySelector('#mOk').onclick = () => {
    const vals = {};
    if (reason) {
      const v = dlg.querySelector('#mReason').value.trim();
      dlg.querySelector('#mReasonErr').hidden = !!v;
      if (!v) return; vals.reason = v;
    }
    if (reauth) {
      const v = dlg.querySelector('#mPass').value;
      dlg.querySelector('#mPassErr').hidden = !!v;
      if (!v) return;
    }
    dlg.querySelectorAll('[data-val]').forEach(el => {
      vals[el.dataset.val] = el.type === 'checkbox' ? el.checked : el.value;
    });
    if (dlg.querySelector('#mAck') && !dlg.querySelector('#mAck').checked) {
      dlg.querySelector('#mAckErr').hidden = false; return;
    }
    dlg.close();
    onOk?.(vals);
  };
}

/* ============================ actions ============================ */
function requestAccess(orgId) {
  modal({
    title:'Request temporary support access',
    sub:'Access is time limited, scoped, fully audited, and visible to the organisation owner.',
    confirm:'Start support session',
    reason:true, reauth:true,
    body:`<div class="field">
        <label for="saOrg">Organisation</label>
        <select id="saOrg" data-val="org">${state.orgs.map(o =>
          `<option value="${o.id}"${o.id === orgId ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label for="saScope">Access scope</label>
        <select id="saScope" data-val="scope">
          <option>Read-only · rota and staff</option>
          <option>Read-only · billing</option>

          <option>Read + write · billing</option>

      </div>
      <div class="field">
        <label for="saMins">Duration</label>
        <select id="saMins" data-val="mins">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60" selected>1 hour</option>
          <option value="240">4 hours</option>
          <option value="1440">24 hours</option>
        </select>
      </div>
      <div class="field">
        <label for="saRef">Support case reference</label>
        <input id="saRef" data-val="ref" value="${esc(state.cases[0].id)}" placeholder="RF-0000">
      </div>
      <label class="check"><input type="checkbox" id="mAck">
        <span>I confirm that this access is necessary to resolve the identified support issue.</span></label>
      <span class="err" id="mAckErr" hidden>You must confirm before access is granted.</span>`,
    onOk(v) {
      const mins = Number(v.mins);
      const org = orgById(v.org);
      state.session = { org:org.id, reason:v.reason, scope:v.scope, ref:v.ref, until:Date.now() + mins * 60000 };
      state.sessions.unshift({ org:org.id, admin:ME.name, reason:v.reason, scope:v.scope,
        start:nowStamp(), exp:`+${mins} min`, status:'active', ref:v.ref, live:true });
      logAudit('support_access.granted', { org:org.id, ent:'support session', from:'-', to:`${mins} minutes` });
      renderBanner(); route();
      toast(`Support access to ${org.name} granted for ${mins} minutes.`);
    },
  });
}

function toggleFlag(key) {
  const f = FLAGS.find(x => x.key === key), s = state.flags[key];
  const turningOff = s.on;
  const go = () => {
    s.on = !s.on; if (!s.on) s.roll = 0; else s.roll = s.roll || 100;
    logAudit(s.on ? 'feature_flag.enabled' : 'feature_flag.disabled',
      { ent:key, from:String(turningOff), to:String(s.on) });
    route(); toast(`${f.name} ${s.on ? 'enabled' : 'disabled'} in Production.`);
  };
  if (f.critical) {
    modal({ title:`${turningOff ? 'Disable' : 'Enable'} ${f.name}?`, danger:turningOff,
      sub:`<span class="mono">${esc(key)}</span> is marked critical. It changes behaviour for live tenants immediately.`,
      confirm:turningOff ? 'Disable flag' : 'Enable flag', reason:true, reauth:true, onOk:go });
  } else go();
}

function suspendOrg(id) {
  const org = state.orgs.find(o => o.id === id);
  const on = org.status === 'suspended';
  modal({
    title:on ? `Reactivate ${org.name}?` : `Suspend ${org.name}?`, danger:!on,
    sub:on ? 'Staff regain access immediately and published rotas become visible again.'
           : `${n(org.users)} users lose access immediately. Published rotas stay stored but become unreadable.`,
    confirm:on ? 'Reactivate organisation' : 'Suspend organisation', reason:true, reauth:!on,
    onOk() {
      const from = org.status; org.status = on ? 'active' : 'suspended';
      logAudit(on ? 'organisation.reactivated' : 'organisation.suspended',
        { org:org.id, ent:org.id, from, to:org.status });
      route(); toast(`${org.name} ${on ? 'reactivated' : 'suspended'}.`);
    },
  });
}

function resolveCase(id) {
  const c = state.cases.find(x => x.id === id);
  modal({ title:`Resolve ${id}?`, confirm:'Resolve case', reason:true,
    sub:'The requester is emailed a resolution summary. Internal notes are never included.',
    onOk() {
      const from = c.status; c.status = 'resolved'; c.upd = 'just now';
      logAudit('support_case.resolved', { org:c.org, ent:id, from, to:'resolved' });
      route(); toast(`${id} resolved.`);
    } });
}

  const sw = (on, label) => `<button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(label)}"
    onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')==='true'?'false':'true');
      logAudit('platform_settings.updated',{ent:'${esc(label)}',from:'${on}',to:String(this.getAttribute('aria-checked'))});
      toast('${esc(label)} updated.')"></button>`;

  return `
  <div class="pagehead"><div><h1>Platform settings</h1>
    <p class="lede">Configuration that applies to every tenant. Changes are audited and take effect immediately.</p></div>
  </div>
  <div data-tabs>
    <div class="tabs" role="tablist">${['General','Branding','Authentication','Security','Email','Storage',
      'Data Retention','Administrators','API','Maintenance']
      .map((t, i) => `<button role="tab" data-tab="${t}" aria-selected="${i === 0}">${t}</button>`).join('')}</div>

    ${panel('General', `<section class="card"><div class="body">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        <div class="field"><label for="gN">Platform name</label><input id="gN" value="RotaFlow"></div>
        <div class="field"><label for="gS">Support email</label><input id="gS" value="support@rotaflow.co.uk"></div>
        <div class="field"><label for="gU">Platform URL</label><input id="gU" value="https://rota.gakinz.com"></div>
        <div class="field"><label for="gT">Default timezone</label><select id="gT"><option>Europe/London</option><option>UTC</option></select></div>
        <div class="field"><label for="gL">Default language</label><select id="gL"><option>English (UK)</option><option>English (US)</option></select></div>
        <div class="field"><label for="gD">Date format</label><select id="gD"><option>DD/MM/YYYY</option><option>YYYY-MM-DD</option></select></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn p" onclick="logAudit('platform_settings.general_updated',{ent:'general',to:'saved'});toast('General settings saved.')">Save changes</button>
        <button class="btn" onclick="toast('Changes discarded.')">Discard</button></div></div></section>`, true)}

    ${panel('Branding', `<section class="card"><div class="body">
      ${setting('Platform logo', 'Shown in the console rail and on every transactional email.', '<button class="btn sm" onclick="toast(\'Logo upload opened.\')">Replace</button>')}
      ${setting('Primary colour', 'Brand blue used for actions and active state across both surfaces.',
        '<span class="pill neutral plain mono">#3B6FE0</span>')}
      ${setting('Favicon', 'Browser tab icon for the customer app and this console.', '<button class="btn sm" onclick="toast(\'Favicon upload opened.\')">Replace</button>')}
      ${setting('Support branding', 'Show RotaFlow branding on customer-facing support replies.', sw(true, 'Support branding'))}
    </div></section>`)}

    ${panel('Authentication', `<section class="card"><div class="body">
      ${setting('Self-service registration', 'Allow new organisations to sign up without an invitation.', sw(true, 'Self-service registration'))}
      ${setting('Email verification required', 'Block access until the address is confirmed.', sw(true, 'Email verification'))}
      ${setting('Magic links', 'Passwordless sign-in for staff accounts on shared devices.', sw(true, 'Magic links'))}
      ${setting('Google sign-in', 'OAuth via Google Workspace.', sw(true, 'Google sign-in'))}
      ${setting('Microsoft sign-in', 'OAuth via Entra ID.', sw(false, 'Microsoft sign-in'))}
      ${setting('Session duration', 'How long a customer session lasts before re-authentication.',
        '<select class="btn"><option>7 days</option><option selected>30 days</option><option>90 days</option></select>')}
    </div></section>`)}

    ${panel('Security', `
      <div class="callout warn" style="margin-bottom:16px">${ico('shield','ico')}
        <span>These controls protect the platform console itself. Weakening any of them requires a
        Platform Owner and is announced to every other administrator.</span></div>
      <section class="card"><div class="body">
      ${setting('Require MFA for platform administrators', 'Non-negotiable for Owner and Administrator roles.', sw(true, 'MFA requirement'))}
      ${setting('Administrator session timeout', 'Idle time before the console locks.',
        '<select class="btn"><option>15 minutes</option><option selected>30 minutes</option><option>1 hour</option></select>')}
      ${setting('IP allowlist', 'Only these ranges may reach /admin. Four ranges configured.',
        '<button class="btn sm" onclick="toast(\'IP allowlist opened-4 ranges.\')">Manage</button>')}
      ${setting('Sign-in alerts', 'Email every administrator when a new device signs in to the console.', sw(true, 'Sign-in alerts'))}
      ${setting('Maximum concurrent sessions', 'Per administrator account.',
        '<select class="btn"><option>1</option><option selected>2</option><option>5</option></select>')}
      ${setting('Re-authenticate for critical actions', 'Suspensions, deletions, flag changes and role changes.', sw(true, 'Re-authentication'))}
      </div></section>`)}

    ${panel('Email', `<section class="card"><div class="body">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        <div class="field"><label for="eN">Sender name</label><input id="eN" value="RotaFlow"></div>
        <div class="field"><label for="eE">Sender address</label><input id="eE" value="info@gakinz.com">
          <span class="hint">Must be a domain with published SPF and DKIM, or delivery fails silently.</span></div>
        <div class="field"><label for="eP">Provider</label><select id="eP"><option>Custom SMTP</option><option>Postmark</option></select></div>
      </div>
      <div style="margin-top:14px">${setting('Delivery status', 'Last 24 hours: 4,182 sent, 12 bounced, 0 complaints.', pill('ok') + ' Healthy')}</div>
      <button class="btn" style="margin-top:14px" onclick="toast('Test email sent to sarah.okonjo@rotaflow.co.uk.')">Send test email</button>
    </div></section>`)}

    ${panel('Storage', `<section class="card"><div class="body">
      ${barRows([{ k:'Documents', v:412, d:'412 GB' }, { k:'Avatars', v:38, d:'38 GB' },
        { k:'Exports', v:96, d:'96 GB' }, { k:'Backups', v:684, d:'684 GB', color:'var(--warning)' }])}
      <div style="margin-top:14px">
        ${setting('Maximum file size', 'Per upload, across all tenants.', '<span class="mono">25 MB</span>')}
        ${setting('Permitted types', 'Everything else is rejected at upload.', '<span class="mono">pdf, png, jpg, csv, xlsx</span>')}
      </div></div></section>`)}

    ${panel('Data Retention', `<section class="card"><div class="body">
      ${setting('Rota history', 'Kept for payroll and dispute resolution.', '<span class="mono">7 years</span>')}
      ${setting('Attendance records', 'Clock-in, clock-out and GPS traces.', '<span class="mono">3 years</span>')}
      ${setting('Deleted tenant grace period', 'Recovery window before permanent erasure.', '<span class="mono">30 days</span>')}
      ${setting('Audit log', 'Deliberately exempt from erasure and from Platform Owner deletion.', '<span class="pill neutral plain">Indefinite</span>')}
    </div></section>`)}

    ${panel('Administrators', `
      <div class="callout info" style="margin-bottom:16px">${ico('users','ico')}
        <span>The last remaining Platform Owner cannot be removed or demoted. The control is disabled below,
        not merely hidden.</span></div>
      <section class="card"><header><h3>Platform administrators</h3><span class="spacer"></span>
        <button class="btn sm p" onclick="modal({title:'Invite platform administrator',confirm:'Send invitation',reason:true,
          body:'<div class=&quot;field&quot;><label for=&quot;aE&quot;>Email address</label><input id=&quot;aE&quot; data-val=&quot;e&quot; placeholder=&quot;name@rotaflow.co.uk&quot;></div><div class=&quot;field&quot;><label for=&quot;aR&quot;>Platform role</label><select id=&quot;aR&quot; data-val=&quot;r&quot;><option>Platform Owner</option><option selected>Platform Administrator</option><option>Platform Support</option><option>Platform Finance</option></select></div>',
          onOk(v){logAudit('platform_admin.invited',{ent:v.e||'invitee',to:v.r});toast('Invitation sent. MFA enrolment required before first sign-in.')}})">Invite administrator</button></header>
        ${table([{h:'Administrator'},{h:'Platform role'},{h:'MFA'},{h:'Last login'},{h:'Status'},{h:'Actions'}],
          state.admins.map(a => {
            const owners = state.admins.filter(x => x.role === 'owner' && x.status === 'active').length;
            const lastOwner = a.role === 'owner' && owners <= 1;
            return [`<div class="rowav"><span class="av">${initials(a.name)}</span>
              <span class="two-line"><span class="t">${esc(a.name)}</span>
              <span class="s mono">${esc(a.email)}</span></span></div>`,
              `<span class="pill ${a.role === 'owner' ? 'info' : 'neutral plain'}">${esc(ROLES[a.role].name)}</span>`,
              a.mfa ? pill('ok') + ' Enrolled' : pill('warn') + ' Not enrolled',
              `<span class="dim">${esc(a.last)}</span>`, pill(a.status),
              `<div style="display:flex;gap:5px;justify-content:flex-end">
                <button class="btn sm" onclick="toast('Role change for ${esc(a.name)} opened.')" ${lastOwner ? 'disabled title="The final Platform Owner cannot be demoted"' : ''}>Change role</button>
                <button class="btn sm d" ${lastOwner ? 'disabled title="The final Platform Owner cannot be removed"' : ''}
                  onclick="modal({title:'Remove ${esc(a.name)}?',danger:true,confirm:'Remove administrator',reason:true,reauth:true,sub:'Platform access ends immediately. Their organisation membership is untouched.',onOk(){logAudit('platform_admin.removed',{ent:'${esc(a.email)}',from:'${a.role}',to:'none'});toast('${esc(a.name)} removed from the platform console.')}})">Remove</button></div>`];
          }))}</section>`)}

    ${panel('API', `<section class="card"><div class="body">
      ${setting('Public API', 'Tenant-scoped REST API for payroll and HR systems.', sw(true, 'Public API'))}
      ${setting('Rate limit', 'Requests per minute, per organisation.', '<span class="mono">600 / min</span>')}
      ${setting('Webhook retries', 'Exponential backoff before a webhook endpoint is marked failing.', '<span class="mono">5 attempts</span>')}
      ${setting('API keys issued', 'Across 96 organisations.', '<button class="btn sm" onclick="toast(\'API key register opened.\')">Manage keys</button>')}
    </div></section>`)}

    ${panel('Maintenance', `
      <div class="callout bad" style="margin-bottom:16px">${ico('alert','ico')}
        <span>Maintenance mode signs out every user on every tenant and returns a holding page. Use it only
        for migrations that cannot run online.</span></div>
      <section class="card"><div class="body">
      ${setting('Maintenance mode', 'Currently off. The platform is serving normally.',
        `<button class="btn d" onclick="modal({title:'Enable maintenance mode?',danger:true,confirm:'Enable maintenance mode',reason:true,reauth:true,sub:'48,726 users across 1,284 organisations lose access immediately.',onOk(){logAudit('platform.maintenance_enabled',{ent:'maintenance_mode',from:'false',to:'true'});toast('Maintenance mode enabled. Holding page live.',true)}})">Enable</button>`)}
      ${setting('Scheduled window', 'Announced to tenants seven days ahead.', '<span class="mono">10 Aug 2026 02:00-03:00 BST</span>')}
      ${setting('Read-only mode', 'A softer option. Sign-in works, writes are refused.', sw(false, 'Read-only mode'))}
      </div></section>`)}
  </div>`;
};

/* ============================ boot ============================ */
$('#roleSel').innerHTML = ALL.map(r =>
  `<option value="${r}"${r === state.role ? ' selected' : ''}>${ROLES[r].name}</option>`).join('');
$('#roleSel').onchange = e => {
  state.role = e.target.value;
  const id = location.hash.slice(2).split('/')[0] || 'overview';
  if (!guard(id)) { toast(`${ROLES[state.role].name} cannot open that area.`, true); }
  route();
};
$('#railBtn').onclick = () => $('#rail').classList.toggle('open');
$('#refreshBtn').onclick = () => { route(); toast('Platform figures refreshed.'); };
$('#saBtn').onclick = () => state.session ? endSession('Exited') : requestAccess();
$('#whoami').onclick = () => toast(`${ME.name} · ${ROLES[state.role].name} · MFA enrolled`);
document.addEventListener('click', e => {
  const a = e.target.closest('.rail a');
  if (a && window.innerWidth <= 1000) $('#rail').classList.remove('open');
});
addEventListener('hashchange', route);
if (!location.hash) location.hash = '#/overview';
route();
</script>
