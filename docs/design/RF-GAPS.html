<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RotaFlow design gaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* RotaFlow design gaps, review file v2 (31 Oct 2026).
   Two layers: .doc is the review file itself; .m is the product, drawn with the
   live app's tokens from src/index.css (Inter, 4px controls, 12px cards).
   Ratios measured with product-design/scripts/contrast.py. */

:root {
  /* live product tokens */
  --canvas:#F4F4F4; --surface:#FFFFFF; --subtle:#F8F8F9; --rail:#F4F4F4;
  --line:#D0D1D2;            /* decoration only: 1.53:1 on white, never a field edge */
  --field:#8A8F98;           /* field edges: 3.25:1 on white (WCAG 1.4.11) */
  --divider:#E6E7E9;
  --ink:#0D1934; --ink-2:#3E4A6E; --muted:#5A6684;   /* muted 5.72:1 white, 5.20:1 canvas */
  --primary:#3B6FE0;         /* fills; white on it 4.63:1 */
  --primary-ink:#2F5BC0;     /* text and links: 5.65:1 on canvas (was #3B6FE0 4.21:1) */
  --primary-wash:#EEF3FD; --brand:#0C60F8;
  --ok:#1EA06B;   --ok-ink:#12724E;   --ok-wash:#E7F5EE;
  --warn:#E0A030; --warn-ink:#7A5410; --warn-wash:#FBF2E1;
  --bad:#D94A3A;  --bad-ink:#B23A2C;  --bad-wash:#FAEAE7;  /* bad-ink 5.94:1 (was #D94A3A 4.21:1) */
  --info:#388FD4; --info-ink:#1B5E8E; --info-wash:#E8F2FA;
  --s-indigo:#6CA0EB; --s-teal:#4FB39A; --s-amber:#C69A45; --s-violet:#C48FD6; --s-sky:#56AACD; --s-moss:#86AC6A; --s-rose:#E888AB;
  --r-ctl:4px; --r-card:12px;
  --sh-1:0 1px 2px rgba(13,25,52,.06); --sh-2:0 6px 20px rgba(13,25,52,.08); --sh-3:0 18px 50px rgba(13,25,52,.16);
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* review file */
  --d-bg:#FBFBFC; --d-ink:#0D1934; --d-muted:#4B5568; --d-line:#E3E5E9; --d-accent:#2F5BC0;
}
* { box-sizing:border-box; }
html { scroll-padding-top:72px; }
body { margin:0; background:var(--d-bg); color:var(--d-ink); font:400 15px/1.55 var(--sans); -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01"; }
a { color:var(--primary-ink); }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }
button, input, select, textarea { font:inherit; color:inherit; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ================= review file shell ================= */
.skip { position:absolute; left:-999px; top:8px; background:#fff; padding:8px 12px; z-index:99; }
.skip:focus { left:8px; }
.doc { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100vh; }
.toc { position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--d-line); background:#fff; padding:22px 16px 24px; }
.toc .brand { display:flex; gap:10px; align-items:center; margin:0 6px 4px; }
.toc .brand b { font-size:15px; letter-spacing:-.2px; }
.toc .brand span { display:block; font-size:12px; color:var(--d-muted); }
.toc .meta { margin:12px 6px 18px; padding:10px 12px; border:1px solid var(--d-line); border-radius:10px; font-size:12px; color:var(--d-muted); line-height:1.5; }
.toc .meta b { color:var(--d-ink); }
.toc ol { list-style:none; margin:0; padding:0; display:grid; gap:1px; }
.toc li a { display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:center; padding:8px 8px; border-radius:8px; color:var(--d-ink); text-decoration:none; font-size:13.5px; font-weight:500; }
.toc li a:hover { background:#F2F4F8; }
.toc li a[aria-current="page"] { background:#EAF0FC; color:var(--d-accent); font-weight:650; }
.toc li a .no { font:600 11px/1 var(--mono); color:var(--d-muted); }
.toc li a[aria-current="page"] .no { color:var(--d-accent); }
.toc li a .ct { font:600 11px/1 var(--mono); color:var(--d-muted); background:#F2F4F8; border-radius:999px; padding:3px 7px; }
.toc .grp { font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--d-muted); padding:16px 8px 6px; }
.dmain { min-width:0; }
.dbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:12px 40px; background:rgba(251,251,252,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--d-line); }
.dbar .crumb { font-size:13px; color:var(--d-muted); }
.dbar .crumb b { color:var(--d-ink); font-weight:600; }
.dbar .sp { margin-left:auto; }
.dbar .nav2 { display:flex; gap:8px; }
.dbtn { display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:7px 12px; border-radius:8px; border:1px solid var(--d-line); background:#fff; font-size:13px; font-weight:600; color:var(--d-ink); text-decoration:none; cursor:pointer; }
.dbtn:hover { border-color:#C5CAD3; }
.dbtn.pri { background:var(--d-accent); border-color:var(--d-accent); color:#fff; }
.menu { display:none; }
.page { padding:40px 40px 72px; max-width:1360px; margin:0 auto; }
.kicker { font:600 12px/1 var(--mono); color:var(--d-accent); letter-spacing:.04em; }
.ptitle { font-size:36px; line-height:1.15; font-weight:700; letter-spacing:-.8px; margin:10px 0 10px; text-wrap:balance; }
.plede { font-size:17px; color:var(--d-muted); max-width:72ch; margin:0; }
.h2 { font-size:22px; font-weight:700; letter-spacing:-.3px; margin:48px 0 6px; }
.h2 + .sub { color:var(--d-muted); margin:0 0 18px; font-size:14.5px; max-width:80ch; }
.h3 { font-size:16px; font-weight:650; margin:0 0 6px; }
.dcard { background:#fff; border:1px solid var(--d-line); border-radius:14px; }
.dgrid2 { display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr)); }
.dgrid3 { display:grid; gap:16px; grid-template-columns:repeat(3,minmax(0,1fr)); }
.dgrid4 { display:grid; gap:16px; grid-template-columns:repeat(4,minmax(0,1fr)); }
.stat { padding:18px 20px; display:grid; gap:4px; }
.stat .l { font-size:13px; color:var(--d-muted); font-weight:550; }
.stat .v { font-size:32px; font-weight:700; letter-spacing:-.8px; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat .s { font-size:12.5px; color:var(--d-muted); }
.steps3 { counter-reset:s; }
.step { padding:20px; display:grid; gap:6px; align-content:start; }
.step .n { width:28px; height:28px; border-radius:999px; background:var(--d-ink); color:#fff; display:grid; place-items:center; font:700 13px/1 var(--mono); margin-bottom:6px; }
.step p { margin:0; color:var(--d-muted); font-size:14px; }
.legend2 { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--d-muted); }
.legend2 span { display:inline-flex; gap:7px; align-items:center; }

/* severity + status tags in the review file */
.sev { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.sev::before { content:""; width:7px; height:7px; border-radius:999px; background:currentColor; }
.sev.high { color:var(--bad-ink); background:var(--bad-wash); }
.sev.med { color:var(--warn-ink); background:var(--warn-wash); }
.sev.low { color:var(--info-ink); background:var(--info-wash); }
.tagd { display:inline-block; font:600 11px/1.4 var(--mono); padding:2px 7px; border-radius:6px; background:#F2F4F8; color:var(--d-muted); white-space:nowrap; }
.tagd.v { background:#EAF0FC; color:var(--d-accent); }

/* direction block: problem / change / done when */
.direction { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid var(--d-line); border-radius:14px; background:#fff; overflow:hidden; margin:24px 0 20px; }
.direction > div { padding:18px 20px; display:grid; gap:8px; align-content:start; }
.direction > div + div { border-left:1px solid var(--d-line); }
.direction .lab { font:650 11px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; display:flex; gap:8px; align-items:center; }
.direction .lab i { width:8px; height:8px; border-radius:2px; display:block; }
.direction ul { margin:0; padding-left:18px; display:grid; gap:6px; font-size:14px; }
.direction li::marker { color:#9AA3B2; }
.direction .ids { display:flex; gap:6px; flex-wrap:wrap; }

/* frames */
.frames { display:grid; gap:24px; grid-template-columns:minmax(0,1fr) 340px; align-items:start; }
.frames.solo { grid-template-columns:minmax(0,1fr); }
.frames.pair { grid-template-columns:repeat(2,minmax(0,1fr)); }
.fcap { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin:0 2px 8px; font-size:12.5px; color:var(--d-muted); }
.fcap b { color:var(--d-ink); font-weight:650; font-size:13px; }
.browser { border:1px solid var(--d-line); border-radius:12px; overflow:hidden; background:#fff; box-shadow:var(--sh-2); }
.browser .chrome { height:34px; display:flex; align-items:center; gap:7px; padding:0 12px; background:#F3F4F6; border-bottom:1px solid var(--d-line); }
.browser .chrome i { width:10px; height:10px; border-radius:999px; background:#D9DCE1; display:block; }
.browser .chrome .url { margin-left:12px; flex:1; max-width:440px; height:22px; border-radius:6px; background:#fff; border:1px solid var(--d-line); font:500 11.5px/20px var(--mono); color:var(--d-muted); padding:0 10px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.phone { border:10px solid #0D1934; border-radius:38px; overflow:hidden; background:#fff; box-shadow:var(--sh-2); }
.phone .notch { height:22px; background:#fff; display:flex; justify-content:center; align-items:center; }
.phone .notch i { width:80px; height:6px; border-radius:999px; background:#E3E5E9; display:block; }
.fit { position:relative; overflow:hidden; }
.fit > .vp { position:absolute; top:0; left:0; transform-origin:0 0; }
.note { font-size:12.5px; color:var(--d-muted); margin:10px 2px 0; }
.ann { margin-top:14px; display:grid; gap:8px; }
.ann div { display:grid; grid-template-columns:22px 1fr; gap:10px; font-size:13.5px; align-items:start; }
.ann b.pin { width:22px; height:22px; border-radius:999px; background:var(--d-accent); color:#fff; font:700 11px/22px var(--mono); text-align:center; }

/* findings table */
.ftools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 14px; }
.segd { display:inline-flex; border:1px solid var(--d-line); border-radius:9px; overflow:hidden; background:#fff; }
.segd button { border:0; background:none; padding:7px 12px; font-size:13px; font-weight:600; color:var(--d-muted); cursor:pointer; min-height:36px; }
.segd button + button { border-left:1px solid var(--d-line); }
.segd button[aria-pressed="true"] { background:var(--d-ink); color:#fff; }
.ftable { width:100%; border-collapse:collapse; font-size:14px; }
.ftable th { text-align:left; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--d-muted); font-weight:650; padding:12px 14px; border-bottom:1px solid var(--d-line); background:#FAFBFC; }
.ftable td { padding:14px; border-bottom:1px solid var(--d-line); vertical-align:top; }
.ftable tr:last-child td { border-bottom:0; }
.ftable .id { font:650 12.5px/1.4 var(--mono); white-space:nowrap; }
.ftable .what { font-weight:600; display:block; margin-bottom:3px; }
.ftable .ev { color:var(--d-muted); font-size:13px; display:block; }
.ftable .fix { font-size:13.5px; }
.ftable a.go { font-size:13px; font-weight:600; white-space:nowrap; }
.empty-d { padding:28px; text-align:center; color:var(--d-muted); }

/* plan list */
.phase { display:grid; grid-template-columns:220px minmax(0,1fr) minmax(0,1fr); border-top:1px solid var(--d-line); }
.phase:first-child { border-top:0; }
.phase > div { padding:20px; }
.phase .pn { font:700 12px/1 var(--mono); color:var(--d-accent); margin-bottom:8px; }
.phase .pt { font-size:16px; font-weight:650; }
.phase ul { margin:0; padding-left:18px; display:grid; gap:6px; font-size:14px; }
.phase .lab { font:650 11px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--d-muted); margin-bottom:10px; }

/* design system swatches */
.sw-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.swc { border:1px solid var(--d-line); border-radius:12px; overflow:hidden; background:#fff; }
.swc .chip { height:64px; display:flex; align-items:flex-end; padding:10px 12px; font-weight:650; font-size:14px; }
.swc .inf { padding:10px 12px; font-size:12.5px; color:var(--d-muted); display:grid; gap:2px; }
.swc .inf b { color:var(--d-ink); font:600 12.5px/1.4 var(--mono); }
.pass { color:var(--ok-ink); font-weight:650; } .fail { color:var(--bad-ink); font-weight:650; }

@media (max-width:1240px) {
  .frames, .frames.pair { grid-template-columns:minmax(0,1fr); }
  .frames .phonewrap { max-width:360px; }
  .dgrid4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .phase { grid-template-columns:minmax(0,1fr); }
  .phase > div + div { padding-top:0; }
  .sw-row { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:960px) {
  .doc { grid-template-columns:minmax(0,1fr); }
  .toc { position:fixed; inset:0 auto 0 0; width:290px; z-index:60; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--sh-3); }
  .toc.open { transform:none; }
  .menu { display:inline-flex; }
  .page { padding:28px 18px 56px; }
  .dbar { padding:10px 18px; }
  .dbar .nav2 .dbtn span { display:none; }
  .direction, .dgrid2, .dgrid3 { grid-template-columns:minmax(0,1fr); }
  .direction > div + div { border-left:0; border-top:1px solid var(--d-line); }
  .ptitle { font-size:28px; }
  .ftable thead { display:none; }
  .ftable, .ftable tbody, .ftable tr, .ftable td { display:block; width:100%; }
  .ftable tr { border-bottom:1px solid var(--d-line); padding:10px 0; }
  .ftable td { border:0; padding:6px 14px; }
}
@media (max-width:560px) { .dgrid4, .sw-row { grid-template-columns:minmax(0,1fr); } }

/* ================= product layer (.m) ================= */
.m { font:400 14px/1.5 var(--sans); color:var(--ink); background:var(--canvas); text-align:left; }
.m .mono { font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.m .dim { color:var(--muted); } .m .strong { font-weight:600; }
.m .h1 { font-size:26px; line-height:1.2; font-weight:700; letter-spacing:-.5px; }
.m .h2m { font-size:18px; font-weight:650; letter-spacing:-.2px; }
.m .h3m { font-size:15px; font-weight:650; }
.m .lede { color:var(--muted); font-size:14px; margin-top:4px; }
.m .eyebrow { font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

.m .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:7px 14px; border-radius:var(--r-ctl); border:1px solid var(--field); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; white-space:nowrap; text-decoration:none; cursor:pointer; }
.m .btn.p { background:var(--primary); border-color:var(--primary); color:#fff; }
.m .btn.d { color:var(--bad-ink); border-color:color-mix(in srgb, var(--bad) 55%, white); }
.m .btn.q { border-color:transparent; background:transparent; color:var(--primary-ink); padding-left:6px; padding-right:6px; }
.m .btn.sm { min-height:30px; padding:4px 10px; font-size:12.5px; }
.m .btn.lg { min-height:46px; padding:11px 20px; font-size:15px; }
.m .btn[disabled] { background:#EEF0F3; border-color:#D6D9DE; color:#5A6684; cursor:not-allowed; }
.m .btn .ico { width:15px; height:15px; }
.m .why { font-size:12px; color:var(--muted); }

.m .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); }
.m .card > .hd { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--divider); }
.m .card > .hd .sp { margin-left:auto; }
.m .card > .bd { padding:16px; }
.m .tiles { display:grid; gap:12px; }
.m .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 16px; display:grid; gap:2px; align-content:start; }
.m .tile .l { font-size:12.5px; color:var(--muted); font-weight:550; }
.m .tile .v { font-size:28px; font-weight:700; letter-spacing:-.6px; font-variant-numeric:tabular-nums; line-height:1.2; }
.m .tile .s { font-size:12.5px; color:var(--muted); }

.m .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
.m .pill::before { content:""; width:6px; height:6px; border-radius:999px; background:currentColor; }
.m .pill.ok { background:var(--ok-wash); color:var(--ok-ink); }
.m .pill.warn { background:var(--warn-wash); color:var(--warn-ink); }
.m .pill.bad { background:var(--bad-wash); color:var(--bad-ink); }
.m .pill.info { background:var(--info-wash); color:var(--info-ink); }
.m .pill.neutral { background:#EEF0F3; color:var(--ink-2); }
.m .pill.flag { font-family:var(--mono); font-weight:500; background:#EEF0F3; color:var(--ink-2); }
.m .pill.flag::before, .m .pill.plain::before { display:none; }

.m table { width:100%; border-collapse:collapse; font-size:13.5px; }
.m th { text-align:left; font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:9px 14px; border-bottom:1px solid var(--divider); background:var(--subtle); white-space:nowrap; }
.m td { padding:11px 14px; border-bottom:1px solid var(--divider); vertical-align:middle; }
.m tr:last-child td { border-bottom:0; }
.m td.num, .m th.num { text-align:right; }
.m .who { display:flex; align-items:center; gap:10px; min-width:0; }
.m .av { width:30px; height:30px; border-radius:999px; flex:none; display:grid; place-items:center; background:var(--primary-wash); color:var(--primary-ink); font-weight:650; font-size:11.5px; }
.m .two .t { font-weight:600; display:block; line-height:1.3; }
.m .two .s { display:block; font-size:12px; color:var(--muted); line-height:1.35; }
.m .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.m .nowrap { flex-wrap:nowrap; }

.m .callout { display:flex; gap:12px; padding:12px 14px; border-radius:var(--r-card); border:1px solid; font-size:13.5px; }
.m .callout .ico { width:18px; height:18px; flex:none; margin-top:1px; }
.m .callout > div { min-width:0; flex:1; }
.m .callout.warn { background:var(--warn-wash); border-color:#EDD3A1; } .m .callout.warn .ico { color:var(--warn-ink); }
.m .callout.bad { background:var(--bad-wash); border-color:#EFC2BA; } .m .callout.bad .ico { color:var(--bad-ink); }
.m .callout.ok { background:var(--ok-wash); border-color:#B6E0C9; } .m .callout.ok .ico { color:var(--ok-ink); }
.m .callout.info { background:var(--info-wash); border-color:#BFD9EE; } .m .callout.info .ico { color:var(--info-ink); }

.m .field { display:grid; gap:5px; }
.m .field .lbl { font-size:12.5px; font-weight:600; }
.m .input { min-height:38px; padding:8px 10px; border-radius:var(--r-ctl); border:1px solid var(--field); background:#fff; font-size:13.5px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.m .input.ph { color:var(--muted); }
.m .input.err { border-color:var(--bad); box-shadow:0 0 0 1px var(--bad); }
.m .hint { font-size:12px; color:var(--muted); } .m .err-t { font-size:12px; color:var(--bad-ink); font-weight:600; }
.m .g2 { display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
.m .g3 { display:grid; gap:12px; grid-template-columns:repeat(3,minmax(0,1fr)); }
.m .g4 { display:grid; gap:12px; grid-template-columns:repeat(4,minmax(0,1fr)); }
.m .split { display:grid; gap:16px; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:stretch; }
.m .split.even { grid-template-columns:repeat(2,minmax(0,1fr)); }
.m .split > .card { display:flex; flex-direction:column; } .m .split > .card > .bd { flex:1; }

const emailDlg = () => dlgWrap(`<div class="dlg" style="width:460px;margin:0 auto"><div class="hd"><span class="row" style="gap:6px;font-size:12px"><span class="dim">1 New address</span><span class="dim">›</span><b style="color:var(--primary-ink)">2 Code</b><span class="dim">›</span><span class="dim">3 Done</span></span><span class="h2m" style="display:block;margin-top:8px">Check your new inbox</span></div><div class="bd">

function qrSvg() {
  let s = 7, cells = ''; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280; const N = 25, u = 148 / N;
  const f = (x, y) => `<rect x="${x * u}" y="${y * u}" width="${7 * u}" height="${7 * u}" fill="#0D1934"/><rect x="${(x + 1) * u}" y="${(y + 1) * u}" width="${5 * u}" height="${5 * u}" fill="#fff"/><rect x="${(x + 2) * u}" y="${(y + 2) * u}" width="${3 * u}" height="${3 * u}" fill="#0D1934"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const inF = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9); if (!inF && rnd() > .52) cells += `<rect x="${(x * u).toFixed(2)}" y="${(y * u).toFixed(2)}" width="${u.toFixed(2)}" height="${u.toFixed(2)}" fill="#0D1934"/>`; }
  return `<svg width="170" height="170" viewBox="0 0 148 148" role="img" aria-label="Illustration of a site clock-in code, not scannable">${cells}${f(0, 0)}${f(N - 7, 0)}${f(0, N - 7)}</svg>`;
}

    ${mcard('What staff see', `<div style="display:grid;gap:14px;justify-items:center;text-align:center"><span style="font:650 40px/1 var(--mono)">06:58</span><span class="dim">Early · 07:00–15:00</span><span class="seg"><span>${ico('gps', 'ico')} GPS</span><span class="on">Scan site code</span></span><div style="width:280px;height:200px;border-radius:12px;background:#0D1934;display:grid;place-items:center;color:#fff;font-size:12.5px"><span style="width:130px;height:130px;border:2px solid rgba(255,255,255,.85);border-radius:14px;display:block"></span>Point the camera at the poster</div><span class="hint">No camera? Use GPS, or ask a manager to clock you in.</span></div>`)}

const consentApp = () => appShell('Rota builder', 'Rota builder / <b>Sunnyvale House</b>', `<div class="phead"><div><span class="h1">Rota builder</span><div class="lede">The grid stays fully visible.</div></div></div><div class="card" style="height:560px;display:grid;place-items:center;color:var(--muted)">Rota grid</div>

/* ---------------- 13 system ---------------- */
const swc = (name, hex, fg, ratio, ok, note) => `<div class="swc"><div class="chip" style="background:${hex}"><span style="background:#fff;color:#0D1934;padding:2px 8px;border-radius:6px;font-size:13px">${name}</span></div><div class="inf"><b>${hex}</b><span>${ratio} · <span class="${ok ? 'pass' : 'fail'}">${ok ? 'passes' : 'fails'}</span></span><span>${note}</span></div></div>`;
PAGES.system = () => phead(`${NO('system')} · Reference`, 'Design system changes',
  'The live system stays: Inter, 4 px controls, 12 px cards, the same blue. Only the pairs that fail are changed, each with its measurement.',
  `<span class="sev high">2 high</span> <span class="sev med">2 medium</span> <span class="sev low">2 low</span>`) +
  direction(['F14', 'F15', 'F16', 'F17', 'F25', 'F37'],
    ['Blue and red text under 4.5:1', 'Field edges at 1.53:1', 'Text at 10 px or 80% opacity', 'US date order and Title Case chips'],
    ['Text uses -ink shades; fills keep the bright colours', 'Field border #8A8F98', 'Minimum 12 px; muted token, not opacity', 'UK dates "25–29 Aug"; sentence case'],
    ['axe colour-contrast: zero on every screen', 'Every field edge measures 3:1 or more', 'No text below 12 px in src/']) + `

    ${swc('Brand text, today', '#3B6FE0', '#fff', 'on #F4F4F4 4.21:1', false, 'Sidebar "Flow", links on grey')}
    ${swc('Brand text, fix', '#2F5BC0', '#fff', 'on #F4F4F4 5.65:1', true, 'primary-ink, already in src/index.css')}
    ${swc('Red text, today', '#D94A3A', '#fff', 'on white 4.21:1', false, 'Decline, overdue notes')}
    ${swc('Red text, fix', '#B23A2C', '#fff', 'on white 5.94:1', true, 'danger-ink')}
    ${swc('Field edge, today', '#D0D1D2', '#0D1934', 'on white 1.53:1', false, 'Inputs, selects')}
    ${swc('Field edge, fix', '#8A8F98', '#fff', 'on white 3.25:1', true, 'New token: field')}
    ${swc('Muted text', '#5A6684', '#fff', 'on white 5.72:1', true, 'Use instead of opacity')}
    ${swc('Warning text', '#7A5410', '#fff', 'on wash 6.09:1', true, 'Not #E0A030 (2.04:1)')}
  </div>
  <h2 class="h2">Components that change</h2><p class="sub">Drawn with the live tokens.</p>
  <div class="dcard" style="padding:24px"><div class="m" style="background:#fff;display:grid;gap:22px">
    <div class="row" style="gap:12px"><span class="btn p">Primary</span><span class="btn">Secondary</span><span class="btn d">Decline</span><span class="btn q">Text button</span><span style="display:grid;gap:3px"><span class="btn" disabled>Publish 3 changes</span><span class="why">Fix 2 things first</span></span></div>
    <div class="row" style="gap:8px">${pill('ok', 'Approved')}${pill('warn', 'Waiting')}${pill('bad', 'Late 12 min')}${pill('info', 'On break')}${pill('neutral', 'Finished')}<span class="dim" style="font-size:12.5px;margin-left:8px">Sentence case · 12 px minimum · -ink text on wash</span></div>
    <div class="g3"><div class="field"><span class="lbl">Field, new edge</span><span class="input">Sunnyvale House</span><span class="hint">Border #8A8F98, 3.25:1</span></div><div class="field"><span class="lbl">Field with error</span><span class="input err">2 Nov 2026</span><span class="err-t">Say what is wrong and how to fix it.</span></div><div class="field"><span class="lbl">Dates</span><span class="input">25–29 Aug 2026</span><span class="hint">Day first, en dash, no seconds on times</span></div></div>
  </div></div>
  <h2 class="h2">Rules every new screen follows</h2>
  <div class="dgrid3">${[['One primary action', 'Only one filled blue button per screen. Everything else is secondary or a text button.'], ['Disabled means explained', 'A disabled button always has its reason as visible text beside or under it.'], ['Warnings inform, blockers stop', 'Amber never disables anything. Red only for what the server will also refuse.'], ['Equal rows', 'Cards in a row share a height; rows of 2, 3 or 4, never an orphan.'], ['Plain UK English', 'Buttons say what happens. Dates "31 Oct". Times "13:00".'], ['Honest data', 'Missing values say so. Sample data is labelled.']].map(r => `<div class="dcard" style="padding:18px 20px"><span class="h3">${r[0]}</span><p style="margin:4px 0 0;color:var(--d-muted);font-size:14px">${r[1]}</p></div>`).join('')}</div>`;

/* ---------------- 14 plan ---------------- */
PAGES.plan = () => phead(`${NO('plan')} · Reference`, 'Build plan',
  'Six phases, smallest and safest first. Each lists the findings it closes and how we will know it is done. Nothing starts until you approve.',
  '') + `<div class="dcard" style="margin-top:28px;overflow:hidden">${[
  ['Phase 1', 'Colour and text fixes', 'Front end · small', ['F14', 'F15', 'F16', 'F17', 'F25', 'F26'], ['Swap text to -ink tokens; new field border token', 'Raise small text to 12 px; drop opacity on text', 'UK date and time formats'], ['axe colour-contrast zero on all 31 captured screens', 'pnpm check passes']],
  ['Phase 2', 'Consent and sign in', 'Front end · small', ['F01', 'F18', 'F11', 'F12', 'F13', 'F27'], ['Compact consent bar on the site; corner card in the app', 'Single sign-in card, Clerk sized and named', 'Preview catch-all route'], ['No sideways scroll at 320 and 390', 'Consent never covers content']],
  ['Phase 3', 'Landing layout', 'Front end · medium', ['F02', 'F03', 'F04', 'F05', 'F06', 'F07', 'F09'], ['Hero, Why section and footer as drawn', 'Pricing alignment, trial line, FAQ accordion'], ['Screens match this file at 390, 834, 1440 and 1920', 'Equal card heights in every row']],
  ['Phase 4', 'Dashboard and publishing', 'Front end · medium', ['F19', 'F20', 'F21', 'F22', 'F23', 'F24'], ['Four tiles and "Needs you"', 'Staffing table columns', 'Blocking issues listed; Publish disabled with reason', 'Grouped sidebar; 7-day week view'], ['No clipped column at 1280', 'Publish cannot be pressed while blocked']],
  ['Phase 5', 'New modules, match pass', 'Front end · medium', ['F28', 'F29', 'F30', 'F31', 'F36'], ['Compliance, Cover, Scheduling checks, Timesheets and global states compared side by side with this file', 'Preview routes added so each can be screenshotted'], ['Each screen matched at 390 and 1280', 'UX-SPEC gains a reference row for each']],
  ['Phase 6', 'Needs backend first', 'Backend + front end · large', ['F32', 'F33', 'F34', 'F35', 'F08', 'F10'], ['Upload after the S8 Files module', 'My details after the API rule', 'Email change with Clerk', 'QR after the schema change', 'Cutover copy once the server location is confirmed'], ['Each shipped behind its own check', 'No public page mentions Postgres, Supabase or EU after cutover']],
].map(p => `<div class="phase"><div><div class="pn">${p[0]}</div><div class="pt">${p[1]}</div><div style="margin-top:6px"><span class="tagd">${p[2]}</span></div><div class="ids" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${p[3].map(fid).join('')}</div></div><div><div class="lab">What we do</div><ul>${p[4].map(x => `<li>${x}</li>`).join('')}</ul></div><div><div class="lab">Done when</div><ul>${p[5].map(x => `<li>${x}</li>`).join('')}</ul></div></div>`).join('')}</div>
  <h2 class="h2">What I need from you</h2>
  <div class="dgrid3">
    <div class="dcard step"><span class="n">1</span><span class="h3">Approve the findings</span><p>Reply with the numbers you approve, or "approve all". Corrections first come back here.</p></div>
    <div class="dcard step"><span class="n">2</span><span class="h3">Confirm the server location</span><p>Needed for the data wording on Pricing and Sign in (F08). Until then that copy is held.</p></div>

/* ============================ shell ============================ */
function drawToc(cur) {
  $('#toc-list').innerHTML = TOC.map(([g, items]) => `<li class="grp" aria-hidden="true">${g}</li>${items.map(([id, label, ct]) => `<li><a href="#${id}"${id === cur ? ' aria-current="page"' : ''}><span class="no">${NO(id)}</span><span>${label}</span>${ct ? `<span class="ct">${ct()}</span>` : ''}</a></li>`).join('')}`).join('');
}
function fitFrames() {
  document.querySelectorAll('.fit').forEach(f => {
    const vp = f.firstElementChild, w = +f.dataset.w, k = f.clientWidth / w;
    vp.style.transform = `scale(${k})`;
    f.style.height = Math.ceil(vp.offsetHeight * k) + 'px';
  });
}
function render() {
  let id = location.hash.slice(1);
  if (!PAGES[id]) id = 'start';
  drawToc(id);
  const i = ORDER.indexOf(id), prev = ORDER[i - 1], next = ORDER[i + 1];
  $('#crumb').innerHTML = `${esc(LABEL[id][0])} / <b>${esc(LABEL[id][1])}</b>`;
  $('#prev').outerHTML = prev ? `<a id="prev" class="dbtn" href="#${prev}">← <span>${esc(LABEL[prev][1])}</span></a>` : '<span id="prev"></span>';
  $('#next').outerHTML = next ? `<a id="next" class="dbtn pri" href="#${next}"><span>${esc(LABEL[next][1])}</span> →</a>` : '<span id="next"></span>';
  $('#page').innerHTML = PAGES[id]() + (next ? `<div style="margin-top:48px;display:flex;justify-content:flex-end"><a class="dbtn pri" href="#${next}">Next: ${esc(LABEL[next][1])} →</a></div>` : '');
  document.title = `${LABEL[id][1]} · RotaFlow design gaps`;
  if (id === 'findings') drawFindings();
  $('#toc').classList.remove('open');
  requestAnimationFrame(fitFrames);
  window.scrollTo(0, 0);
  $('#page').focus({ preventScroll:true });
}
addEventListener('hashchange', render);
addEventListener('resize', () => requestAnimationFrame(fitFrames));
document.addEventListener('click', e => {
  const s = e.target.closest('[data-surf]'), v = e.target.closest('[data-sev]');
  if (s) { FILTER.surf = s.dataset.surf; document.querySelectorAll('[data-surf]').forEach(b => b.setAttribute('aria-pressed', b === s)); drawFindings(); }
  if (v) { FILTER.sev = v.dataset.sev; document.querySelectorAll('[data-sev]').forEach(b => b.setAttribute('aria-pressed', b === v)); drawFindings(); }
  const f = e.target.closest('[data-f]');
  if (f) { FILTER = { surf:'All', sev:'All' }; const id = f.dataset.f;
    if ($('#frows')) { document.querySelectorAll('[data-surf],[data-sev]').forEach(b => b.setAttribute('aria-pressed', b.dataset.surf === 'All' || b.dataset.sev === 'All')); drawFindings(); }
    setTimeout(() => { const r = document.getElementById('row-' + id); if (r) { r.scrollIntoView({ block:'center' }); r.style.background = '#FFF8E6'; } }, 60); }
});
$('#menuBtn').addEventListener('click', () => $('#toc').classList.toggle('open'));
render();

</script>
