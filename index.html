<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0369A1" />
    <meta name="description" content="Multi-tenant, offline-first staff rota scheduling — build and publish rotas in minutes, invite your team, and let everyone see exactly what they're working from any device." />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />

    <!-- Preconnect to offloaded services for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter Variable (body, full weight range) + JetBrains Mono (times/payroll)
         + Plus Jakarta Sans (headings — the Ink Navy re-skin's display face,
         see docs/DESIGN.md §2) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>RotaFlow</title>
  </head>
  <body class="bg-background text-content dark:bg-background-dark dark:text-content-dark">
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
