# pnpm blocks dependency install scripts by default.
# Add a package here only after reviewing why it needs to run a build script.
allowBuilds:
  # Downloads the Sentry CLI binary. Only used by the sourcemap upload in
  # vite.config.ts, which runs only when SENTRY_AUTH_TOKEN is set at build time.
  '@sentry/cli': true
  # Prints Clerk's telemetry notice only; nothing to build.
  '@clerk/shared': false

# Security overrides (audit 1 Nov 2026). Only same-major fixes: serialize-javascript
# < 7.1.3 has a low XSS advisory (GHSA via @rollup/plugin-terser in workbox-build).
# glob, minimatch and deepmerge advisories need major jumps that break ESLint and
# workbox-build; they run only at build time over this repo's own files. Revisit
# with the planned ESLint 10 and vite-plugin-pwa upgrades.
overrides:
  serialize-javascript: ^7.1.3
